    //     and the month table reconciles with the totals.
    let deployedThis = 0;
    while (pi < px.length && px[pi].date.slice(0, 7) <= m) {
      let amt = deployedOf(b, px[pi]);
      deployedThis += amt; deployed += amt;
      for (const lot of lots) {
        if (amt <= 0) break;
        if (lot.left > 0) { const take = Math.min(lot.left, amt); lot.left -= take; amt -= take; }
      }
      if (amt > 0) advance += amt;   // bought ahead of budget
      pi++;
    }

    rows.push({
      month: m, credited: credit, deployed: deployedThis, lapsed: lapsedThis,
      balance: lots.reduce((t, l) => t + l.left, 0)
    });
  }

  // Future-dated purchases: still deployed, folded into the latest row so the table reconciles.
  let ahead = 0;
  for (; pi < px.length; pi++) {
    const amt = deployedOf(b, px[pi]);
    deployed += amt; ahead += amt;
    let rest = amt;
    for (const lot of lots) {
      if (rest <= 0) break;
      if (lot.left > 0) { const take = Math.min(lot.left, rest); lot.left -= take; rest -= take; }
    }
    if (rest > 0) advance += rest;
  }
  if (ahead > 0 && rows.length) {
    const last = rows[rows.length - 1];
    last.deployed += ahead;
    last.balance = lots.reduce((t, l) => t + l.left, 0);
  }

  const open = lots.filter(l => l.left > 0);
  const pending = open.reduce((t, l) => t + l.left, 0);
  const oldest = open.length ? open.reduce((a, l) => (mIdx(l.month) < mIdx(a.month) ? l : a)) : null;
  const notStarted = s > e;
  const monthly = notStarted ? allocFor(b, start) : allocFor(b, thisMonth());
  const last = px.length ? px[px.length - 1] : null;
  const lastSkip = S.skips.filter(k => k.bucketId === b.id).sort((a, c) => a.date.localeCompare(c.date)).pop();
  const reviewed = [last && last.date, lastSkip && lastSkip.date].filter(Boolean).sort().pop() || null;

  return {
    /* Every figure below is in this currency. Carried on the ledger rather than
       looked up from the bucket at each call site, because most of them — the
       status badge, the buy sheet, the month buttons — only ever hold an L. */
    ccy: ccyOf(b),
    pending, monthly, cap, capAmount: monthly * cap, advance, notStarted, startMonth: start,
    // The surviving month-by-month lots, oldest first — what a partial buy eats
    // into, and what the month buttons on the buy sheet are built from. `amount`
    // is the full credit and `left` what is still owed, so left < amount marks a
    // month that is part-paid rather than untouched.
    openLots: open.map(l => ({ month: l.month, amount: l.amount, left: l.left }))
                  .sort((a, c) => a.month.localeCompare(c.month)),
    oldestMonth: oldest ? oldest.month : null,
    /* Two different numbers, and mixing them up reads as a bug on the card.
       `openMonths` is HOW MANY months still owe something — the count to put in
       words, because "2 months behind" is how anyone reads ₹20,000 at ₹10,000 a
       month. `ageMonths` is HOW OLD the oldest of them is, which is the only
       thing that predicts lapsing (a lot expires at month + cap). They differ by
       one whenever the current month is also unbought, i.e. most of the time.
       Counting lots rather than dividing pending by `monthly` is deliberate:
       `monthly` is today's allocation, older lots may have been credited at a
       different one, and a part-paid month would divide into a fraction. */
    openMonths: open.length,
    ageMonths: oldest ? Math.max(0, mIdx(thisMonth()) - mIdx(oldest.month)) : 0,
    lapses, lapsedTotal, credited, deployed, rows,
    lastPurchase: last, lastSkip, reviewed, purchaseCount: px.length
  };
}

/* Money still sitting in a bucket is never green. The plan is to invest every
   month, so this month's un-deployed credit is already something to act on,
   and once a whole month has passed it is a backlog rather than a "wait" —
   the old rule called a full month's delay "On track" with a green tick. Green
   now means one thing: nothing is waiting. */
function statusOf(L) {
  const cap = L.cap;
  if (L.notStarted)     return { key: "idle",  st: "--st-idle", ic: "•", label: "Starts " + mLabel(L.startMonth) };
  if (L.monthly <= 0)   return { key: "idle",  st: "--st-idle", ic: "•", label: "No budget set" };
  if (L.pending <= 0)   return { key: "clear", st: "--st-good",    ic: "✓",
                                 label: L.advance > 0 ? "Paid ahead by " + money(L.advance, L.ccy) : "Fully deployed" };
  /* The number in the words is the COUNT of unbought months; the thresholds are
     the AGE of the oldest one. Using the age for both said "1 month behind" on a
     bucket holding two unbought months, because the current month contributes
     money without contributing any age. */
  const n = L.openMonths;
  const mo = n + " month" + (n === 1 ? "" : "s");
  if (L.ageMonths >= cap - 1) return { key: "cap", st: "--st-critical", ic: "✕", label: mo + " behind · lapsing now" };
  if (L.ageMonths >= 1)       return { key: "act", st: "--st-serious",  ic: "▲", label: mo + " behind" };
  return { key: "due", st: "--st-warning", ic: "!", label: "This month still to invest" };
}

const RANK = { cap: 0, act: 1, due: 2, clear: 3, idle: 4 };

/** What a bucket tracks, in words. Free text you type, not a linked feed —
    there is no price fetching in this app, so nothing has to match a
    provider's spelling. Buckets loaded from an older file carry the linked
    scheme name into it, so existing cards keep their subtitles. */
function tracksLabel(b) {
  if (b.kind === "group") {
    const n = (b.members || []).length;
    return n + " holding" + (n === 1 ? "" : "s");
  }
  return (b.tracks || "").trim() || "no description";
}

/* ============================================================
   6. Dashboard
   ============================================================ */

function renderHero() {
  const rows = S.buckets.map(b => ({ b, L: ledgerOf(b) }));
  /* "due" counts too: a bucket with this month's money still sitting in it is
     something to do, which is the whole point of the plan. Only fully-deployed
     and not-yet-started buckets are off this list. */
  const urgent = rows.filter(r => ["cap", "act", "due"].includes(statusOf(r.L).key)).length;

  /* One column per currency actually in play, in a fixed order so the hero does
     not reshuffle when a bucket is added, and skipped entirely when nothing is
     held in it — a plan with no dollar bucket looks exactly as it did before.
     Never a single sum: a rupee lot and a dollar lot are different money, this
     app holds no exchange rate to bridge them with (each buy carries only the
     rate of its own day, and there is no price fetching here by design), so
     adding them would invent a number. Showing one and hiding the other would
     be worse — half the plan, silently missing. So they are set side by side,
     separated by a mark that makes no arithmetic claim. */
  const held = ["INR", "USD"].filter(c => rows.some(r => r.L.ccy === c));
  const live = held.length ? held : ["INR"];   // an empty plan still shows a ₹0
  const sum = (c, k) => rows.filter(r => r.L.ccy === c).reduce((t, r) => t + r.L[k], 0);
  const pair = (k, cls) => live.map(c => {
    const v = sum(c, k);
    return `<div class="${cls}${cls === "v" && k === "lapsedTotal" && v > 0 ? " v-danger" : ""}"
      >${moneyBig(v, c)}</div>`;
  }).join(`<span class="fig-sep" data-for="${cls}" aria-hidden="true">·</span>`);

  document.getElementById("hero").innerHTML = `
    <div>
      <div class="label">Waiting to be invested</div>
      <div class="moneypair">${pair("pending", "figure")}</div>
      <div class="sublabel">Budget credited so far, minus what you have actually bought.${
        live.length > 1 ? " Rupee and dollar buckets are counted separately — nothing is converted." : ""}</div>
    </div>
    <div class="side">
      <div><div class="label">Budget / month</div>
        <div class="moneypair">${pair("monthly", "v")}</div></div>
      <div><div class="label">Needs action</div>
        <div class="v">${urgent} of ${S.buckets.length} bucket${S.buckets.length === 1 ? "" : "s"}</div></div>
      <div><div class="label">Lapsed so far</div>
        <div class="moneypair">${pair("lapsedTotal", "v")}</div></div>
    </div>`;
}

function renderDash() {
  const host = document.getElementById("view-dash");
  if (!S.buckets.length) {
    host.innerHTML = `<div class="panel glass empty">
      <h2>No buckets yet</h2>
      <p>A bucket is one thing you fund every month — an index fund, an ETF, or a group
         like your US stocks. Nothing is pre-filled; build the plan the way you actually run it.</p>
      <button class="btn primary" onclick="editBucket()">Add your first bucket</button>
    </div>`;
    return;
  }

  const rows = S.buckets.map(b => ({ b, L: ledgerOf(b) }));
  rows.sort((x, y) => {
    const d = RANK[statusOf(x.L).key] - RANK[statusOf(y.L).key];
    return d || (y.L.pending - x.L.pending);
  });

  host.innerHTML = `<div class="cards">` + rows.map(({ b, L }) => {
    const st = statusOf(L);
    const pct = L.capAmount ? Math.min(100, L.pending / L.capAmount * 100) : 0;
    /* Spelled out rather than "3mo old", because it sits inches from a badge
       reading "4 months behind" and the terse form invites reading the age as
       another count of months. See the two fields in computeLedger. */
    const since = L.oldestMonth
      ? `oldest budget from ${mLabel(L.oldestMonth)}${
          L.ageMonths ? " · waiting " + L.ageMonths + " month" + (L.ageMonths === 1 ? "" : "s") : " (current)"}`
      : "nothing pending";
    const rev = daysAgo(L.reviewed);

    return `<article class="card glass">
      <div class="card-head">
        <div>
          <div class="nm">${esc(b.name)}</div>
          <div class="sub">${money(L.monthly, L.ccy)}/month · ${esc(tracksLabel(b))}</div>
        </div>
        <span class="status st-${st.key}" style="--st:var(${st.st})"><span class="ic">${st.ic}</span>${st.label}</span>
      </div>

      <div class="pending-row">
        <span class="amt">${moneyBig(L.pending, L.ccy)}</span>
        <span class="since">pending · ${since}</span>
      </div>

      <div class="meter" style="--st:var(${st.st})">
        <div class="track"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div>
        <div class="ticks"><span>${money(0, L.ccy)}</span><span>${L.cap}-month cap · ${money(L.capAmount, L.ccy)}</span></div>
      </div>

      <div class="kv">
        <div><span>Last bought</span> <b>${L.lastPurchase ? dLabel(L.lastPurchase.date) : "never"}</b>${
          L.lastPurchase ? ` <span>(${daysAgo(L.lastPurchase.date)}d)</span>` : ""}</div>
        <div><span>Reviewed</span> <b>${rev == null ? "never" : rev + "d ago"}</b></div>
        ${L.lapsedTotal > 0 ? `<div><span>Lapsed</span> <b style="color:var(--danger-text)">${money(L.lapsedTotal, L.ccy)}</b></div>` : ""}
        ${L.advance > 0 ? `<div><span>Bought ahead</span> <b>${money(L.advance, L.ccy)}</b></div>` : ""}
      </div>

      <div class="card-actions">
        <button class="btn sm primary" onclick="buyForm('${b.id}')">Record buy</button>
        <button class="btn sm" onclick="skipForm('${b.id}')">Log a wait</button>
        <button class="btn sm" onclick="editBucket('${b.id}')">Edit</button>
      </div>
    </article>`;
  }).join("") + `</div>`;
}

      </div>
    </div>

    <div class="panel glass">
      <h3>Buckets <button class="btn sm" style="margin-left:auto" onclick="editBucket()">Add bucket</button></h3>
      ${S.buckets.length ? S.buckets.map(b => {
        const L = ledgerOf(b);
        const allocs = (b.allocations || []).slice().sort((x, y) => x.from.localeCompare(y.from));
        return `<div class="plan-item">
          <div>
            <div class="nm">${esc(b.name)} <span class="chip">${b.kind}</span>${
              ccyOf(b) === "USD" ? ' <span class="chip">USD</span>' : ""}</div>
            <div class="meta">
              ${allocs.map(a => `${money(a.amount, L.ccy)}/mo from ${mLabel(a.from)}`).join(" → ")}
              · started ${mLabel(b.start)}
              ${b.kind === "group" ? "" : " · " + esc(tracksLabel(b))}

            </div>
          </div>
          <div style="display:flex;gap:6px">

      }).join("") : `<p class="muted">Nothing yet. Add a bucket to start.</p>`}
    </div>

    <div class="panel glass">

function wipe() {
  if (!confirm("Delete the entire plan, all purchases and all logs from this browser?\n\nThis cannot be undone. Save to file first if you want a copy.")) return;
  S = DEFAULTS(); fileHandle = null; autosave(); renderAll(); toast("Cleared");
}

function delBucket(id) {
  const b = S.buckets.find(x => x.id === id);
  const n = S.purchases.filter(p => p.bucketId === id).length;
  if (!confirm(`Delete "${b.name}"` + (n ? ` and its ${n} recorded purchase${n > 1 ? "s" : ""}` : "") + "?")) return;
  S.buckets = S.buckets.filter(x => x.id !== id);
  S.purchases = S.purchases.filter(p => p.bucketId !== id);
  S.skips = S.skips.filter(k => k.bucketId !== id);
  markDirty(); renderAll();
}

/* ============================================================
   8. Ledger view (the table view / audit trail)
   ============================================================ */

function renderLedger() {
  const host = document.getElementById("view-ledger");
  if (!S.buckets.length) { host.innerHTML = `<div class="panel glass empty"><p>Nothing to show yet.</p></div>`; return; }

  const activity = [
    ...S.purchases.map(p => ({ ...p, t: "buy" })),
    ...S.skips.map(k => ({ ...k, t: "wait" }))
  ].sort((a, b) => b.date.localeCompare(a.date) || (b.id > a.id ? 1 : -1));

  const nameOf = id => (S.buckets.find(b => b.id === id) || {}).name || "(deleted)";

  /* What was bought, in the currency it was bought in — that is the fact, and
     the ledger it belongs to is denominated the same way. The rupee cost of a
     dollar buy follows in parentheses when it is known, because it is a real and
     useful number (it is what left the bank, at the rate of that day) but a
     secondary one; before, it was the headline and the dollars were the note.
     `ccy` is read off the purchase rather than off the bucket, so a row logged
     while the bucket was set to dollars still reads in dollars if the bucket is
     later switched — the entry records what happened. */
  const amountCell = a => {
    if (a.t !== "buy") return "—";
    const c = a.ccy === "USD" ? "USD" : "INR";
    const main = money(a.rawAmount != null ? a.rawAmount : a.amountInr, c);
    if (c !== "USD") return main;
    return main + (a.amountInr && a.fx
      ? ` <span class="muted">(${fmt(a.amountInr)} at ${a.fx})</span>` : "");
  };

  host.innerHTML = S.buckets.map(b => {
    const L = ledgerOf(b);
    return `<div class="panel glass">
      <h3>${esc(b.name)}${L.ccy === "USD" ? ' <span class="chip">USD</span>' : ""}
        <span class="muted" style="font-weight:400">
        · credited ${money(L.credited, L.ccy)} · deployed ${money(L.deployed, L.ccy)}
        · pending ${money(L.pending, L.ccy)}${
          L.lapsedTotal ? " · lapsed " + money(L.lapsedTotal, L.ccy) : ""}</span></h3>
      <!-- data-label is what the phone layout reads: below 620px the header row is
           hidden and every cell prints its own label from this attribute, so the
           labels live in one place instead of being duplicated per breakpoint. -->
      <table class="grid">
        <thead><tr><th>Month</th><th>Credited</th><th>Deployed</th><th>Lapsed</th><th>Pending after</th></tr></thead>
        <tbody>${L.rows.slice().reverse().map(r => `<tr>
          <td>${mLabel(r.month)}</td>
          <td data-label="Credited">${r.credited ? money(r.credited, L.ccy) : "—"}</td>
          <td data-label="Deployed">${r.deployed ? money(r.deployed, L.ccy) : "—"}</td>
          <td data-label="Lapsed" class="${r.lapsed ? "lapse" : ""}">${r.lapsed ? "−" + money(r.lapsed, L.ccy) : "—"}</td>
          <td data-label="Pending after">${money(r.balance, L.ccy)}</td></tr>`).join("")}</tbody>
      </table>
    </div>`;
  }).join("") + `
    <div class="panel glass">
      <h3>Activity</h3>
      ${activity.length ? `<table class="grid">
        <!-- six columns in the body, so six here: the Delete cell had no <th> at
             all, which left thead and tbody disagreeing about the column count -->
        <thead><tr><th>Date</th><th>Bucket</th><th>Action</th><th>Amount</th><th>Note</th><th><span class="sr">Actions</span></th></tr></thead>
        <tbody>${activity.map(a => `<tr>
          <td>${dLabel(a.date)}</td>
          <td data-label="Bucket">${esc(nameOf(a.bucketId))}</td>
          <td data-label="Action">${a.t === "buy" ? "Bought" : "Waited"}</td>
          <td data-label="Amount">${amountCell(a)}</td>
          <td data-label="Note">${esc((a.member ? a.member + " · " : "") + (a.note || a.reason || ""))}</td>
          <td class="row-act" style="text-align:right"><button class="btn sm danger" onclick="delEntry('${a.t}','${a.id}')">Delete</button></td>
        </tr>`).join("")}</tbody></table>` : `<p class="muted">No purchases or waits logged yet.</p>`}
    </div>`;
}

function delEntry(t, id) {
  if (!confirm("Delete this entry?")) return;
  if (t === "buy") S.purchases = S.purchases.filter(p => p.id !== id);
  else S.skips = S.skips.filter(k => k.id !== id);
  markDirty(); renderAll();
}

function openModal(html, onMount) {
  modal.innerHTML = html;
  backdrop.classList.add("open");
  if (onMount) onMount(modal);
  const f = modal.querySelector("input,select,textarea");
  if (f) f.focus();
}
function closeModal() { backdrop.classList.remove("open"); modal.innerHTML = ""; }
backdrop.addEventListener("mousedown", e => { if (e.target === backdrop) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && backdrop.classList.contains("open")) closeModal(); });

/* ---------- bucket editor ---------- */

function editBucket(id) {
  const isNew = !id;
  const b = isNew
    ? { id: uid(), name: "", kind: "mf", currency: "INR", start: thisMonth(),
        openingPending: 0, allocations: [{ from: thisMonth(), amount: 10000 }],
        tracks: "", members: [], note: "" }
    : JSON.parse(JSON.stringify(S.buckets.find(x => x.id === id)));

  /* step and placeholder follow the currency, because 500 is a sensible nudge on
     a rupee budget and an absurd one on a dollar budget. Read from the select
     rather than from `b`, so switching "Buys in" redraws these correctly. */
  const curCcy = () => {
    const sel = document.getElementById("f-ccy");
    return (sel ? sel.value : b.currency) === "USD" ? "USD" : "INR";
  };
  const allocRows = a => {
    const isUSD = curCcy() === "USD";
    return a.map((x, i) => `<div class="allocrow" data-ai="${i}">
      <input type="month" value="${x.from}" data-af>
      <input type="number" min="0" step="${isUSD ? "25" : "500"}" value="${x.amount}" data-aa
        placeholder="${isUSD ? "Dollars per month" : "Rupees per month"}">
      <button class="x btn sm" data-adel title="Remove">×</button></div>`).join("");
  };

  const memRows = m => m.map((x, i) => `<div class="memrow" data-mi="${i}">
      <input value="${esc(x.name)}" data-mn placeholder="Holding name">
      <input value="${esc(x.ticker || "")}" data-mt placeholder="Ticker">
      <input type="number" min="0" step="1" value="${x.weight == null ? "" : x.weight}" data-mw placeholder="Wt">
      <button class="x" data-mdel title="Remove">×</button></div>`).join("");

  openModal(`
    <h2>${isNew ? "Add bucket" : "Edit bucket"}</h2>

    <div class="field">
      <label for="f-name">Name</label>
      <input id="f-name" value="${esc(b.name)}" placeholder="e.g. Nifty 50 Index, GoldBees, US Stocks">
    </div>

    <div class="row2">
      <div class="field">
        <label for="f-kind">Type</label>
        <select id="f-kind">
          <option value="mf" ${b.kind === "mf" ? "selected" : ""}>Fund or ETF</option>
          <option value="equity" ${b.kind === "equity" ? "selected" : ""}>Single stock</option>
          <option value="group" ${b.kind === "group" ? "selected" : ""}>Group of holdings</option>
        </select>
      </div>
      <div class="field">
        <label for="f-ccy">Buys in</label>
        <select id="f-ccy">
          <option value="INR" ${ccyOf(b) === "INR" ? "selected" : ""}>INR — ₹</option>
          <option value="USD" ${ccyOf(b) === "USD" ? "selected" : ""}>USD — $</option>
        </select>
        <div class="hint" id="ccy-hint"></div>
      </div>
    </div>

    <div class="field" id="wrap-tracks" ${b.kind === "group" ? "hidden" : ""}>
      <label for="f-tracks">What it tracks <span class="muted">(optional)</span></label>
      <input id="f-tracks" value="${esc(b.tracks || "")}"
        placeholder="e.g. Motilal Oswal Nifty Midcap 150 Index Fund, or TATAMOTORS">
      <div class="hint">Free text, shown under the bucket name on its card — the full fund name, a
        ticker, whatever you would recognise. It is a label and nothing else: no price is looked up,
        so it does not have to match anyone's spelling.</div>
    </div>

    <div class="field" id="wrap-mem" ${b.kind === "group" ? "" : "hidden"}>
      <label>Holdings in this group</label>
      <div id="mem-list">${memRows(b.members || [])}</div>
      <button class="btn sm" id="mem-add" type="button">Add holding</button>
      <div class="hint">Weights are for your own reference when splitting a buy.</div>
    </div>

    <div class="field">
      <label>Monthly amount <span class="muted" data-unit></span>, effective-dated</label>
      <div id="alloc-list">${allocRows(b.allocations)}</div>
      <button class="btn sm" id="alloc-add" type="button">Add a change</button>
      <div class="hint">Add a row when you raise the amount — past months keep their old
        figure, so history is never rewritten.</div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="f-start">Tracking starts</label>
        <input id="f-start" type="month" value="${b.start}">
      </div>
      <div class="field">
        <label for="f-open">Opening backlog <span class="muted" data-unit></span></label>
        <input id="f-open" type="number" min="0" step="500" value="${b.openingPending || 0}">
        <div class="hint">Already-pending amount as of that month. Lets you start clean without
          re-entering months of history.</div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="f-save">${isNew ? "Add bucket" : "Save"}</button>
    </div>
  `, m => {
    const $ = s => m.querySelector(s);

    const syncKind = () => {
      const k = $("#f-kind").value;
      // a group's card reads "N holdings", so a free-text label would never show
      $("#wrap-tracks").hidden = k === "group";
      $("#wrap-mem").hidden = k !== "group";
    };
    $("#f-kind").onchange = syncKind;

    /* The currency is not a label on the buys — it denominates the whole bucket,
       so the two amount fields on this form are in it too. That was the part
       nothing said out loud: an unlabelled "Amount per month" on a bucket marked
       USD is a coin toss, and either reading produced a ledger that balanced
       dollars against rupees. Now the unit is written next to every field that
       has one, and it follows the select while you are still deciding. */
    const syncCcy = () => {
      const isUSD = curCcy() === "USD";
      m.querySelectorAll("[data-unit]").forEach(el => el.textContent = isUSD ? "in $" : "in ₹");
      $("#ccy-hint").textContent = isUSD
        ? "Everything in this bucket is counted in dollars — the monthly amount below, the backlog, "
          + "the buys and its whole ledger. The rupee cost of a buy is noted beside it, not converted into it."
        : "The monthly amount below, the backlog and the buys are all in rupees.";
      $("#f-open").step = isUSD ? "25" : "500";
      drawAllocs(readAllocs());
    };
    $("#f-ccy").onchange = syncCcy;

    // --- allocation rows
    const readAllocs = () => Array.from(m.querySelectorAll("#alloc-list .allocrow")).map(r => ({
      from: r.querySelector("[data-af]").value || thisMonth(),
      amount: Number(r.querySelector("[data-aa]").value) || 0
    })).filter(a => a.from);
    const drawAllocs = list => { $("#alloc-list").innerHTML = allocRows(list); bindAllocs(); };
    const bindAllocs = () => m.querySelectorAll("[data-adel]").forEach(btn => btn.onclick = () => {
      const list = readAllocs();
      if (list.length <= 1) { toast("Keep at least one amount"); return; }
      list.splice(Number(btn.closest(".allocrow").dataset.ai), 1); drawAllocs(list);
    });
    bindAllocs();
    $("#alloc-add").onclick = () => {
      const list = readAllocs();
      const last = list[list.length - 1] || { from: thisMonth(), amount: 10000 };
      drawAllocs(list.concat([{ from: mStr(mIdx(last.from) + 1), amount: last.amount }]));
    };
    syncCcy();   // after drawAllocs exists — it redraws the rows to pick up the step

    // --- member rows
    const readMems = () => Array.from(m.querySelectorAll("#mem-list .memrow")).map(r => ({
      name: r.querySelector("[data-mn]").value.trim(),
      ticker: r.querySelector("[data-mt]").value.trim(),
      weight: r.querySelector("[data-mw]").value === "" ? null : Number(r.querySelector("[data-mw]").value)
    })).filter(x => x.name);
    const drawMems = list => { $("#mem-list").innerHTML = memRows(list); bindMems(); };
    const bindMems = () => {
      m.querySelectorAll("[data-mdel]").forEach(btn => btn.onclick = () => {
        const list = readMems(); list.splice(Number(btn.closest(".memrow").dataset.mi), 1); drawMems(list);
      });
    };
    bindMems();
    $("#mem-add").onclick = () => drawMems(readMems().concat([{ name: "", ticker: "", weight: null }]));

    // --- save
    $("#f-save").onclick = () => {
      const name = $("#f-name").value.trim();
      if (!name) { toast("Give the bucket a name"); $("#f-name").focus(); return; }
      const kind = $("#f-kind").value;
      const allocs = readAllocs().sort((x, y) => x.from.localeCompare(y.from));
      if (!allocs.length || !allocs.some(a => a.amount > 0)) { toast("Set a monthly amount"); return; }

      // built on top of b, not from scratch, so a bucket carried over from the
      // price-fetching era keeps its leftover keys instead of losing them the
      // first time you open its editor
      const rec = Object.assign({}, b, {
        id: b.id, name, kind,
        currency: $("#f-ccy").value,
        start: $("#f-start").value || allocs[0].from,
        openingPending: Number($("#f-open").value) || 0,
        allocations: allocs,
        tracks: $("#f-tracks").value.trim(),
        members: kind === "group" ? readMems() : (b.members || []),
        note: b.note || ""
      });
      if (mIdx(rec.start) > mIdx(allocs[0].from)) rec.start = allocs[0].from;

      const i = S.buckets.findIndex(x => x.id === rec.id);
      if (i < 0) S.buckets.push(rec); else S.buckets[i] = rec;
      markDirty(); closeModal(); renderAll();
      toast(i < 0 ? "Bucket added" : "Saved");
    };
  });
}

/* ---------- record a buy ---------- */

/* How far the plan is actually settled, for the badge at the top of the buy
   sheet. Derived from the surviving lots, never from the last purchase *date* —
   a date does not say what it covered, since one ₹30,000 buy in April settles
   April, May and June at once. The month before the oldest open lot is the last
   one with nothing left owing on it. */
function paidThrough(L) {
  if (L.notStarted)
    return { key: "idle", st: "--st-idle", ic: "•", label: "Not started", sub: "first month is " + mShort(L.startMonth) };

  const first = L.openLots[0];

  /* Nothing outstanding at all. Any advance is whole months bought early, so it
     is honest to say the plan is paid through past the current month. */
  if (!first) {
    const ahead = L.monthly > 0 ? Math.floor((L.advance || 0) / L.monthly) : 0;
    return {
      key: "clear", st: "--st-good", ic: "✓",
      label: mShort(mStr(mIdx(thisMonth()) + ahead)),
      sub: L.advance > 0 ? "paid through · " + money(L.advance, L.ccy) + " sitting ahead" : "paid through"
    };
  }

  const part = first.left < first.amount ? first : null;
  const done = mIdx(first.month) - 1;

  /* Not one month is fully settled yet — worth saying plainly rather than
     naming a month from before the plan even started. Both of these stay on the
     idle dot: a tick next to the words "part-paid" contradicts itself, and the
     tick has to keep meaning "that month is done". */
  if (done < mIdx(L.startMonth)) {
    return part
      ? { key: "idle", st: "--st-idle", ic: "•", label: mShort(part.month) + " part-paid",
          sub: money(part.left, L.ccy) + " of it still owing" }
      : { key: "idle", st: "--st-idle", ic: "•", label: "Nothing paid yet",
          sub: "running since " + mShort(L.startMonth) };
  }

  /* A lapsed month is no longer an open lot, so it sits inside the settled span
     while never having been bought. "Paid through" would be a plain lie there;
     lapses always fall before the open lots, so any lapse at all is inside it. */
  const lapsed = L.lapses.length > 0;
  return {
    key: "clear", st: lapsed ? "--st-idle" : "--st-good", ic: lapsed ? "•" : "✓",
    label: mShort(mStr(done)),
    sub: (lapsed ? "clear through — but " + money(L.lapsedTotal, L.ccy) + " lapsed unbought" : "paid through")
       + (part ? " · " + mShort(part.month) + " part-paid" : "")
  };
}

/* One button per month still owing, and one for the month after. Cumulative on
   purpose: the engine is FIFO, so money always lands on the oldest open month
   first — there is no way to pay August while July is still open, and a button
   labelled "+ Aug" that quietly settled July too would be lying about it. So
   each button carries every month up to and including its own. The amount comes
   from `lot.left`, not from the monthly figure, which is what makes a part-paid
   month cost only its remainder. */
function monthSteps(L) {
  const steps = [];
  /* To the cent, not to the unit. A button's amount is what gets recorded, so
     rounding it is not a display choice — round a $250.50 lot to $250 and the
     button that says it clears the month leaves fifty cents of it open forever.
     Rupee allocations are whole numbers, so for them this is the same as the
     Math.round it replaces. */
  const exact = n => Math.round(n * 100) / 100;
  let run = 0;
  for (const lot of L.openLots) {
    run += lot.left;
    steps.push({ month: lot.month, amount: exact(run), n: steps.length + 1, ahead: false });
  }
  if (L.monthly > 0) {
    /* The one month ahead. With a backlog it follows the newest open month;
       with none, it follows whatever the existing advance already covers — but
       never lands before the plan begins, or a bucket starting in November would
       offer to pay for September. */
    const base = steps.length
      ? mIdx(steps[steps.length - 1].month)
      : Math.max(mIdx(thisMonth()) + Math.floor((L.advance || 0) / L.monthly),
                 mIdx(L.startMonth) - 1);
    run += L.monthly;
    steps.push({ month: mStr(base + 1), amount: exact(run), n: steps.length + 1, ahead: true });
  }
  return steps;
}

function buyForm(id) {
  const b = S.buckets.find(x => x.id === id);
  const L = ledgerOf(b);
  const isUSD = L.ccy === "USD";
  const P = paidThrough(L);
  /* Both currencies now. This used to be rupee buckets only, because the lots
     were held in rupees whatever the bucket bought in, so a dollar figure could
     not be turned into a number of months without knowing that buy's rate. A
     dollar bucket's lots are dollars, so its months are as exact as any other
     bucket's and the buttons work the same way. */
  const steps = monthSteps(L);
  const memberField = (b.members || []).length ? `
    <div class="field"><label for="b-mem">Holding</label>
      <select id="b-mem"><option value="">— whole group —</option>
      ${b.members.map(mm => `<option>${esc(mm.name)}</option>`).join("")}</select></div>` : "";

  /* One decision only: which months. No date (it is today), no note — fields
     that stood between "I bought" and it being written down, and skipping them
     costs nothing, because a wrong entry comes straight back out from the
     Ledger tab. */
  openModal(`
    <h2>Record a buy — ${esc(b.name)}</h2>

    <div class="paidrow">
      <span class="status st-${P.key}" style="--st:var(${P.st})"><span class="ic">${P.ic}</span>${P.label}</span>
      <span class="muted">${P.sub}</span>
    </div>

    <p class="muted" style="margin-top:-2px">${
      L.pending > 0
        ? money(L.pending, L.ccy) + " pending" + (L.oldestMonth ? ", oldest from " + mLabel(L.oldestMonth) : "")
          + ". Each button below settles everything up to that month."
        : (L.advance > 0
            ? "Nothing pending — you are already paid ahead by " + money(L.advance, L.ccy) + "."
            : "Nothing pending right now.")}</p>

    ${steps.length ? `
    <div class="buygrid">
      ${steps.map(s => `<button class="btn buychip" type="button" data-buy="${s.amount}">
        <b>+ ${mShort(s.month)}</b>
        <span class="muted">${money(s.amount, L.ccy)}${
          s.ahead ? " · ahead" : s.n > 1 ? " · " + s.n + " months" : ""}</span></button>`).join("")}
    </div>` : ""}

    ${isUSD ? `
    <div class="field">
      <label for="b-amt">Or an exact amount</label>
      <div class="customrow">
        <input id="b-amt" type="number" min="0" step="0.01" placeholder="e.g. 141.36">
        <button class="btn primary" id="b-save">Record</button>
      </div>
      <div class="hint">In dollars — three shares at $47.12 rarely lands on a whole month, and the
        remainder stays open on the oldest one.</div>
    </div>
    <div class="field"><label for="b-fx">USD/INR rate <span class="muted">(optional)</span></label>
      <input id="b-fx" type="number" step="0.01" min="1" placeholder="e.g. 88.50">
      <div class="hint">This bucket's ledger is in dollars, so the rate changes nothing in it. Fill it
        in and the rupee cost is stored beside the buy, in the Ledger tab, as a record of what
        actually left your bank.</div>
    </div>` : `
    <div class="field">
      <label for="b-months">Or pay for a number of months</label>
      <div class="customrow">
        <input id="b-months" type="number" min="1" step="1" placeholder="e.g. 3">
        <button class="btn primary" id="b-save">Record</button>
      </div>
      <div class="hint" id="b-effect"></div>
    </div>`}

    ${memberField}

    <p class="hint" style="margin-top:14px">Dated today${L.monthly > 0 ? ", at " + money(L.monthly, L.ccy) + " a month" : ""}.
      More months than the backlog is fine — the extra carries forward, so the coming months arrive
      already covered and won't show as late. A wrong entry comes back out from the Ledger tab.</p>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
  `, m => {
    const monEl = m.querySelector("#b-months");
    const amtEl = m.querySelector("#b-amt");
    const fxEl = m.querySelector("#b-fx");
    const memSel = m.querySelector("#b-mem");

    /* `raw` is always in the bucket's own currency — that is what the ledger
       consumes and what gets read back out. The rate is a rupee-cost annotation
       on a dollar buy and nothing more: stored when it was given, left null when
       it was not, so an unrated buy carries no invented rupee figure rather than
       a wrong one. */
    const record = raw => {
      const fx = isUSD ? (Number(fxEl && fxEl.value) || null) : 1;
      S.purchases.push({
        id: uid(), bucketId: b.id, date: todayISO(),
        ccy: L.ccy, rawAmount: raw, fx,
        amountInr: isUSD ? (fx ? Math.round(raw * fx) : null) : Math.round(raw),
        member: memSel ? memSel.value : "", note: ""
      });
      markDirty(); closeModal(); renderAll();
      toast(money(raw, L.ccy) + " recorded");
    };

    m.querySelectorAll("[data-buy]").forEach(btn =>
      btn.onclick = () => record(Number(btn.dataset.buy)));

    /* Say out loud which months a count of months actually settles. The buttons
       are exact because they are built from the lots; this box multiplies the
       monthly figure instead, so on a part-paid month the two disagree — by
       design, and this line is what makes the difference visible. */
    const effectEl = m.querySelector("#b-effect");
    const M = x => money(x, L.ccy);
    const monthsAmount = () => Math.round((Number(monEl.value) || 0) * L.monthly * 100) / 100;
    const describe = () => {
      const n = Number(monEl.value) || 0;
      const amt = monthsAmount();
      if (!(n > 0) || !(amt > 0)) {
        effectEl.textContent = L.monthly > 0
          ? "At " + M(L.monthly) + " a month — type 2 for two months, and so on."
          : "This bucket has no monthly amount, so use the buttons above.";
        return;
      }
      let rest = amt;
      const cleared = [];
      let partial = null;
      for (const lot of L.openLots) {
        if (rest <= 0) break;
        if (rest >= lot.left) { rest -= lot.left; cleared.push(lot.month); }
        else { partial = { month: lot.month, left: lot.left - rest }; rest = 0; }
      }
      /* A run of months collapses to a range. Joining three or more with "and"
         was tolerable when a whole-month buy was the exception; now that months
         are the only unit, it is the common case. */
      const parts = [];
      if (cleared.length) parts.push("clears " + (cleared.length > 2
        ? mLabel(cleared[0]) + " through " + mLabel(cleared[cleared.length - 1])
        : cleared.map(mLabel).join(" and ")));
      if (partial) parts.push("leaves " + M(partial.left) + " of " + mLabel(partial.month));
      if (rest > 0) {
        const ahead = L.monthly > 0 ? Math.floor(rest / L.monthly) : 0;
        parts.push(M(rest) + " carries forward" + (ahead >= 1
          ? ", covering the next " + (ahead === 1 ? "month" : ahead + " months") : ""));
      }
      const after = Math.max(0, L.pending - amt);
      effectEl.textContent = M(amt) + " — "
        + (parts.length ? parts.join("; ") : "nothing pending to clear")
        + ". " + (after > 0 ? M(after) + " still pending after this." : "Nothing left pending.");
    };
    if (effectEl) { monEl.oninput = describe; describe(); }

    const save = () => {
      if (isUSD) {
        const raw = Number(amtEl.value);
        if (!(raw > 0)) { toast("Enter an amount in dollars"); return; }
        record(raw);
        return;
      }
      const n = Number(monEl.value);
      if (!(n > 0)) { toast("Enter a number of months"); return; }
      const amt = monthsAmount();
      if (!(amt > 0)) { toast("This bucket has no monthly amount — use a button above"); return; }
      record(amt);
    };
    m.querySelector("#b-save").onclick = save;
    const typed = isUSD ? amtEl : monEl;
    typed.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); save(); } };
  });
}

/* ---------- log a deliberate wait ---------- */

function skipForm(id) {
  const b = S.buckets.find(x => x.id === id);
  openModal(`
    <h2>Log a wait — ${esc(b.name)}</h2>
    <p class="muted" style="margin-top:-6px">Records that you looked and chose not to buy, so the
      backlog age reads as a decision rather than an oversight.</p>
    <div class="field" style="max-width:220px"><label for="s-date">Date</label>
      <input id="s-date" type="date" value="${todayISO()}" max="${todayISO()}"></div>
    <div class="field"><label for="s-why">Reason</label>
      <input id="s-why" placeholder="e.g. at a high, up 3 months straight, waiting for salary"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="s-save">Log wait</button>
    </div>
  `, m => {
    m.querySelector("#s-save").onclick = () => {
      S.skips.push({ id: uid(), bucketId: b.id,
        date: m.querySelector("#s-date").value || todayISO(),
        reason: m.querySelector("#s-why").value.trim() });
      markDirty(); closeModal(); renderAll(); toast("Wait logged");
    };
  });
}

/* ============================================================
   11. Cloud sync — one JSON file in a private GitHub repo
   ============================================================

   Why a repo and not a database: the whole state is a couple of kilobytes,
   read whole and written whole, one user, no queries. A database engine would
   be all cost and no benefit. What this actually needs is one shared file that
   two devices can both reach — and putting it in git means every save is a
   commit, so the plan gets version history and undo, which it has never had.

   localStorage stays the source of truth for rendering. The cloud file is the
   shared copy, pulled on open and pushed after a change. That keeps the app
   instant and fully usable with no signal; sync is a layer on top, not a
   dependency underneath. When it is not configured, not one request is made.

   Honest about the token: it is a fine-grained PAT stored in localStorage on
   each device. Scope it to the ONE data repo with Contents: read/write and
   nothing else, and give it an expiry. Anyone with your unlocked phone can read
   it out of devtools and write to that repo — that is the entire blast radius,
   and revoking the token in GitHub settings ends it instantly. The data repo
   must have Pages OFF: a Pages site is public even when its repo is private. */

const SYNC_CFG  = "dt-sync";        // {owner, repo, path, branch, device, token, auto}
const SYNC_META = "dt-sync-meta";   // {sha, at} — the blob we last exchanged
const SYNC_SNAP = "dt-sync-snap";   // that exchange's exact JSON, to detect local edits

const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsPut = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

function syncCfg() {
  const c = lsGet(SYNC_CFG, null);
  return c && c.owner && c.repo && c.path && c.token ? c : null;
}

/* Whether this device holds edits the cloud has not seen. Comparing against the
   exact string last exchanged is what makes a pull safe to do automatically:
   with nothing local to lose, adopting the remote copy cannot destroy anything. */
function localChanged() { return JSON.stringify(S) !== lsGet(SYNC_SNAP, null); }

/* btoa() throws on anything above U+00FF, and a fund name can hold any
   character at all. Go through UTF-8 bytes both ways. GitHub also wraps the
   base64 it returns, so strip whitespace before decoding. */
function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64dec(b64) {
  const bin = atob(String(b64).replace(/\s+/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function ghURL(c) {
  return "https://api.github.com/repos/"
    + encodeURIComponent(c.owner) + "/" + encodeURIComponent(c.repo)
    + "/contents/" + c.path.split("/").filter(Boolean).map(encodeURIComponent).join("/");
}
const ghHeaders = c => ({
  "Authorization": "Bearer " + c.token,
  "Accept": "application/vnd.github+json",
  "X-GitHub-Api-Version": "2022-11-28"
});

/* `cache: "no-store"` is not decoration. The API answers with an ETag, and a
   cached 200 would make Pull quietly show yesterday's file — the exact failure
   this whole feature exists to prevent. */
async function ghGet(c) {
  const r = await fetch(ghURL(c) + "?ref=" + encodeURIComponent(c.branch || "main"),
    { headers: ghHeaders(c), cache: "no-store" });
  if (r.status === 404) return { ok: false, missing: true, status: 404 };
  if (!r.ok) return { ok: false, status: r.status, msg: await ghMsg(r) };
  const j = await r.json();
  return { ok: true, sha: j.sha, text: b64dec(j.content || "") };
}

/* The conflict guard costs nothing because git already is one: send the sha of
   the blob this device last saw and GitHub itself refuses the write if the file
   has moved since. No pre-flight read, no window in which two devices can both
   think they are current. */
async function ghPut(c, text, sha, message) {
  const body = { message, content: b64enc(text), branch: c.branch || "main" };
  if (sha) body.sha = sha;
  const r = await fetch(ghURL(c), {
    method: "PUT", headers: ghHeaders(c), cache: "no-store", body: JSON.stringify(body)
  });
  /* 409 is always the conflict. 422 is only one when a sha was sent — GitHub
     also uses it for an unknown branch or a malformed path, and reporting those
     as "pull first" would send you chasing a conflict that does not exist. */
  if (r.status === 409) return { ok: false, conflict: true, status: 409 };
  if (r.status === 422 && sha) return { ok: false, conflict: true, status: 422 };
  if (!r.ok) return { ok: false, status: r.status, msg: await ghMsg(r) };
  const j = await r.json();
  return { ok: true, sha: j.content && j.content.sha };
}

async function ghMsg(r) {
  let m = "";
  try { m = (await r.json()).message || ""; } catch (e) {}
  if (r.status === 401) return "token rejected — it may be expired or mistyped";
  if (r.status === 403) return m || "forbidden — check the token's repository and Contents permission";
  if (r.status === 404) return "repo or path not found — check owner/repo, and that the token can see a private repo";
  return m || ("HTTP " + r.status);
}

/* ---------- the two operations ---------- */

function adoptRemote(text, sha) {
  const data = JSON.parse(text);
  if (!data || !Array.isArray(data.buckets)) throw new Error("that file is not a plan");
  S = migrate(Object.assign(DEFAULTS(), data));
  lsPut(SYNC_META, { sha, at: new Date().toISOString() });
  lsPut(SYNC_SNAP, JSON.stringify(S));
  markClean(); autosave(); renderAll();
}

async function pullNow(quiet) {
  const c = syncCfg();
  if (!c) return { ok: false };
  setSyncBadge("busy");
  try {
    const res = await ghGet(c);
    if (res.missing) { setSyncBadge("warn", "No file there yet"); if (!quiet) toast("Nothing in the repo yet — Push to create it"); return res; }
    if (!res.ok) { setSyncBadge("warn", res.msg); if (!quiet) toast("Pull failed: " + res.msg); return res; }
    adoptRemote(res.text, res.sha);
    setSyncBadge("ok");
    if (!quiet) toast("Pulled from " + c.owner + "/" + c.repo);
    return res;
  } catch (e) {
    setSyncBadge("warn", String(e.message || e));
    if (!quiet) toast("Pull failed: " + (e.message || e));
    return { ok: false, status: 0, msg: String(e.message || e) };
  }
}

async function pushNow(quiet) {
  const c = syncCfg();
  if (!c) return { ok: false };
  setSyncBadge("busy");
  /* Two renderings of the same instant: the indented one goes in the file so a
     diff on GitHub is readable, the compact one is the snapshot. They MUST be
     taken together and the compact one MUST be what gets stored, because
     localChanged() compares against JSON.stringify(S) with no indent — storing
     the pretty form made every push look like it had left local changes behind,
     which in turn made the boot pull refuse to adopt a newer cloud copy. */
  const text = JSON.stringify(S, null, 2);
  const snap = JSON.stringify(S);
  const meta = lsGet(SYNC_META, {}) || {};
  const msg = "Update from " + (c.device || "web") + " — "
    + S.buckets.length + " bucket" + (S.buckets.length === 1 ? "" : "s") + ", "
    + S.purchases.length + " purchase" + (S.purchases.length === 1 ? "" : "s");
  try {
    const res = await ghPut(c, text, meta.sha, msg);
    if (res.conflict) {
      setSyncBadge("warn", "Cloud has newer data — pull first");
      toast("Another device saved after this one — open Sync and Pull first");
      return res;
    }
    if (!res.ok) { setSyncBadge("warn", res.msg); if (!quiet) toast("Push failed: " + res.msg); return res; }
    lsPut(SYNC_META, { sha: res.sha, at: new Date().toISOString() });
    lsPut(SYNC_SNAP, snap);
    setSyncBadge("ok");
    if (!quiet) toast("Pushed to " + c.owner + "/" + c.repo);
    return res;
  } catch (e) {
    setSyncBadge("warn", String(e.message || e));
    if (!quiet) toast("Push failed: " + (e.message || e));
    return { ok: false, status: 0, msg: String(e.message || e) };
  }
}

/* Auto-push, immediately. A tracker you have to remember to sync is a tracker
   that silently goes stale on the other device, so this is on by default, and it
   fires the moment an edit lands rather than a few seconds later. The delay it
   replaces was not protecting against keystrokes — nothing in this file calls
   markDirty per character, only on a settled action like saving a bucket or
   recording a buy — it was protecting against overlapping requests, which is now
   handled properly below instead of by hoping the gap is wide enough.

   What still has to be true: never two PUTs to the same file in flight at once.
   GitHub's Contents API takes the sha of the blob you think you are replacing, so
   a second push sent before the first returns would carry the stale sha, come back
   409, and show "Cloud has newer data — pull first" over a conflict with itself.
   So a push that arrives during one is not dropped and not queued behind a timer:
   it sets a flag, and the in-flight push re-runs once when it lands, by which time
   pushNow has stored the new sha. One trailing run covers any number of edits,
   because it sends the whole of S as it stands then, not a backlog of diffs. */
let pushing = false, pushPending = false;
async function runPush() {
  if (pushing) { pushPending = true; return; }
  pushing = true;
  try { await pushNow(true); }
  finally {
    pushing = false;
    if (pushPending) { pushPending = false; runPush(); }
  }
}
function syncQueue() {
  const c = syncCfg();
  if (!c) return;
  /* Move the badge first, and do it even when auto-push is off — otherwise the
     button keeps claiming "in sync" over an edit that nothing is going to send. */
  setSyncBadge();
  if (c.auto === false) return;
  /* Before the push, not inside it: pushNow serialises S, and the local copy must
     already be on disk when it does, or a tab closed mid-request loses the edit
     from both places at once. */
  flushSave();
  runPush();
}

/* Called with no state, the badge works the state out for itself — which is the
   case that matters, because that is a fresh boot and the moment an edit lands.
   Without it the button went on reading a bare "Sync" over unpushed work, and
   with auto-push off that is the one thing you needed telling.

   Unpushed local work is amber and reserved red for a conflict or a failed
   request: with auto-push on the amber clears itself as soon as the request
   returns, so spending the loudest colour on it would train you to ignore the
   loudest colour. */
function setSyncBadge(state, why) {
  /* The refresh button appears and disappears with the config, and this function
     is already the one thing that runs at boot, on every edit and after every
     exchange — so it is where that gets noticed, rather than in a fourth place
     that can fall out of step. Done before the early return below, because it
     does not depend on the badge existing. */
  const rf = document.getElementById("btn-refresh");
  if (rf) rf.hidden = !syncCfg();

  const el = document.getElementById("btn-sync");
  if (!el) return;
  if (!state) state = !syncCfg() ? "off" : localChanged() ? "pend" : "ok";
  el.classList.toggle("s-warn", state === "warn");
  el.classList.toggle("s-pend", state === "pend");
  el.classList.toggle("s-busy", state === "busy");
  /* Mirror the two states that need answering onto the kebab: on a phone this
     button is inside a closed menu, and a warning nobody can see is not one. */
  const kb = document.getElementById("btn-menu");
  if (kb) {
    kb.classList.toggle("s-warn", state === "warn");
    kb.classList.toggle("s-pend", state === "pend");
  }
  const meta = lsGet(SYNC_META, {}) || {};
  el.textContent = state === "busy" ? "Sync…"
    : state === "warn" ? "Sync !"
    : state === "pend" ? "Sync ↑"
    : state === "ok" ? "Sync ✓" : "Sync";
  el.title = why
    || (state === "pend" ? "This device has changes the cloud has not seen"
      : meta.at ? "Last synced " + agoLabel(meta.at)
      : "Sync with a private GitHub repo");
}

function agoLabel(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  if (!isFinite(ms) || ms < 0) return "just now";
  const m = Math.floor(ms / 60000);
  if (m < 1) return "moments ago";
  if (m < 60) return m + " min ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.floor(h / 24);
  return d + (d === 1 ? " day ago" : " days ago");
}

/* ---------- the panel ---------- */

function syncPanel() {
  const c = lsGet(SYNC_CFG, {}) || {};
  const meta = lsGet(SYNC_META, {}) || {};
  const live = !!syncCfg();
  const changed = localChanged();
  const st = !live ? { st: "--st-idle", ic: "•", label: "Not set up" }
    : changed ? { st: "--st-warning", ic: "!", label: "Local changes not pushed" }
    : { st: "--st-good", ic: "✓", label: "In sync" };

  openModal(`
    <h2>Sync</h2>

    <div class="syncrow">
      <span class="status" style="--st:var(${st.st})"><span class="ic">${st.ic}</span>${st.label}</span>
      <span class="muted">${live
        ? (meta.at ? "last synced " + agoLabel(meta.at) : "never synced yet")
        : "one JSON file in a private repo, shared by every device"}</span>
    </div>

    ${live ? `
    <div class="customrow" style="grid-template-columns:1fr 1fr; margin-bottom:14px">
      <button class="btn" id="s-pull">Pull from cloud</button>
      <button class="btn primary" id="s-push">Push to cloud</button>
    </div>
    <p class="hint" style="margin-top:-6px">Pull replaces what is on this device with the cloud copy.
      Push sends this device's copy up. A push is refused if another device saved after your last
      sync — pull first, then redo the entry.</p>` : `
    <p class="muted" style="margin-top:-2px">Create a <b>private</b> repo with Pages left off — say
      <code>tracker-data</code> — then a fine-grained token limited to that one repo with
      <b>Contents: read and write</b>. Nothing else needs ticking.</p>`}

    <div class="row2">
      <div class="field"><label for="s-owner">GitHub user</label>
        <input id="s-owner" value="${esc(c.owner || "")}" placeholder="your-username" autocomplete="off"></div>
      <div class="field"><label for="s-repo">Private repo</label>
        <input id="s-repo" value="${esc(c.repo || "")}" placeholder="tracker-data" autocomplete="off"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="s-path">File path</label>
        <input id="s-path" value="${esc(c.path || "data.json")}" placeholder="data.json" autocomplete="off"></div>
      <div class="field"><label for="s-branch">Branch</label>
        <input id="s-branch" value="${esc(c.branch || "main")}" placeholder="main" autocomplete="off"></div>
    </div>
    <div class="field"><label for="s-token">Fine-grained token</label>
      <input id="s-token" type="password" value="${esc(c.token || "")}"
        placeholder="github_pat_…" autocomplete="off" spellcheck="false">
      <div class="hint">Stored in this browser only, never in the file and never committed. Scope it to
        that one repo, Contents: read and write, with an expiry date. Revoke it in GitHub settings to
        cut this device off.</div>
    </div>
    <div class="field"><label for="s-device">Name this device <span class="muted">(optional)</span></label>
      <input id="s-device" value="${esc(c.device || "")}" placeholder="desktop" autocomplete="off">
      <div class="hint">Goes into the commit message, so the repo's history tells you which device
        made each change.</div>
    </div>
    <div class="field">
      <label style="display:flex; align-items:center; gap:8px; cursor:pointer">
        <input type="checkbox" id="s-auto" ${c.auto === false ? "" : "checked"} style="width:auto">
        Push automatically, as soon as anything changes
      </label>
      <div class="hint">Off means the other device only sees what you remembered to push.</div>
    </div>

    <div class="modal-actions">
      ${live ? `<button class="btn left" id="s-forget">Sign out of this device</button>` : ""}
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="s-save">Save settings</button>
    </div>
  `, m => {
    const read = () => ({
      owner: m.querySelector("#s-owner").value.trim(),
      repo: m.querySelector("#s-repo").value.trim(),
      path: m.querySelector("#s-path").value.trim() || "data.json",
      branch: m.querySelector("#s-branch").value.trim() || "main",
      device: m.querySelector("#s-device").value.trim(),
      token: m.querySelector("#s-token").value.trim(),
      auto: m.querySelector("#s-auto").checked
    });

    m.querySelector("#s-save").onclick = () => {
      const n = read();
      if (!n.owner || !n.repo || !n.token) { toast("User, repo and token are all needed"); return; }
      /* Pointing at a different file invalidates the remembered blob sha, and a
         stale sha would either 409 forever or, worse, be sent against a file it
         never described. Forget it and let the next pull re-establish it. */
      const old = lsGet(SYNC_CFG, {}) || {};
      if (old.owner !== n.owner || old.repo !== n.repo || old.path !== n.path || old.branch !== n.branch) {
        try { localStorage.removeItem(SYNC_META); localStorage.removeItem(SYNC_SNAP); } catch (e) {}
      }
      lsPut(SYNC_CFG, n);
      setSyncBadge();
      closeModal();
      toast("Sync settings saved");
    };

    const pull = m.querySelector("#s-pull");
    if (pull) pull.onclick = async () => {
      if (localChanged() && !confirm("This device has changes the cloud has not seen. Pulling replaces them with the cloud copy. Continue?")) return;
      const r = await pullNow(false);
      if (r.ok) closeModal();
    };
    const push = m.querySelector("#s-push");
    if (push) push.onclick = async () => {
      lsPut(SYNC_CFG, read());
      const r = await pushNow(false);
      if (r.ok) closeModal();
    };
    const forget = m.querySelector("#s-forget");
    if (forget) forget.onclick = () => {
      if (!confirm("Remove the token and sync settings from this device? Your data stays here and in the repo.")) return;
      try { [SYNC_CFG, SYNC_META, SYNC_SNAP].forEach(k => localStorage.removeItem(k)); } catch (e) {}
      setSyncBadge();
      closeModal();
      toast("Signed out on this device");
    };
  });
}

/* ============================================================
   10. Boot
   ============================================================ */

/* Only the view you are looking at gets built; the other two are flagged
   stale and rendered on switch. This is the single biggest win here — every
   click used to run four innerHTML passes, including full ledger tables for
   every bucket and every month, behind `hidden` where nobody could see them.
   Now it runs one. */
let view = "dash";
const VIEWS = { dash: renderDash, plan: renderPlan, ledger: renderLedger };
const stale = { dash: true, plan: true, ledger: true };

function renderView() {
  if (stale[view]) { VIEWS[view](); stale[view] = false; }
}
function renderAll() {
  ledgerCache.clear();
  renderHero();
  stale.dash = stale.plan = stale.ledger = true;
  renderView();
}
function showView(v) {
  view = v;
  for (const k in VIEWS) document.getElementById("view-" + k).hidden = (k !== v);
  renderView();
}

document.querySelectorAll("nav.tabs button").forEach(btn => btn.onclick = () => {
  document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", String(x === btn)));
  showView(btn.dataset.view);
});

document.getElementById("btn-add").onclick = () => editBucket();
document.getElementById("btn-save").onclick = saveToFile;
document.getElementById("btn-load").onclick = loadFromFile;
document.getElementById("btn-sync").onclick = syncPanel;

/* Refresh = pull, with the same guard the Sync panel's Pull button carries.
   Reaching a destructive path in one tap instead of four is the point of this
   button, so it cannot also be the path that loses work quietly: pulling replaces
   this device's copy wholesale, and if there are edits the cloud has not seen yet
   they go with it. Asking is the only honest option — there is no merge here, one
   side wins. With auto-push on the question almost never comes up, because the
   unsynced window is now only as wide as one request.

   The spin is driven here rather than in setSyncBadge, which also has a "busy"
   state: that one fires for pushes too, and a refresh icon spinning over an
   upload says the wrong thing. */
const refreshBtn = document.getElementById("btn-refresh");
refreshBtn.onclick = async () => {
  if (!syncCfg()) return;
  if (localChanged() && !confirm("This device has changes the cloud has not seen. Refreshing replaces them with the cloud copy. Continue?")) return;
  refreshBtn.classList.add("spin");
  try { await pullNow(false); }
  finally { refreshBtn.classList.remove("spin"); }
};

/* The kebab only does anything below 620px. Above it, .actions is a plain row and
   the .open class is inert — so rotating a phone into landscape needs no resize
   handler to tidy up, which is the one thing this file will not add back. */
const kebabBtn = document.getElementById("btn-menu");
const topMenu = document.getElementById("top-menu");
function closeTopMenu() {
  topMenu.classList.remove("open");
  kebabBtn.setAttribute("aria-expanded", "false");
}
kebabBtn.onclick = e => {
  e.stopPropagation();                       // or the document handler below shuts it again
  const open = !topMenu.classList.contains("open");
  topMenu.classList.toggle("open", open);
  kebabBtn.setAttribute("aria-expanded", String(open));
};
/* Closed on any click inside, not per button: all six either act at once or open
   a modal, and none of them wants the menu still hanging over the result. */
topMenu.addEventListener("click", closeTopMenu);
document.addEventListener("click", closeTopMenu);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTopMenu(); });

/* Lite defaults ON. It was chosen for a streamed desktop, but the measured
   reason outlived that: the translucent grid rasters ~5x (see the stylesheet
   header), and a phone GPU is where that is felt most. The button is the A/B —
   the full glass is one click away and the choice sticks. */
const liteBtn = document.getElementById("btn-lite");
function applyLite(on) {
  if (on) document.documentElement.setAttribute("data-lite", "");
  else document.documentElement.removeAttribute("data-lite");
  liteBtn.textContent = on ? "Full glass" : "Lite";
  try { localStorage.setItem("dt-lite", on ? "1" : "0"); } catch (e) {}
}
liteBtn.onclick = () => applyLite(!document.documentElement.hasAttribute("data-lite"));
applyLite((() => {
  try { return localStorage.getItem("dt-lite") !== "0"; } catch (e) { return true; }
})());

const themeBtn = document.getElementById("btn-theme");
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "Light" : "Dark";
  try { localStorage.setItem("dt-theme", t); } catch (e) {}
}
themeBtn.onclick = () => applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
applyTheme((() => {
  try { return localStorage.getItem("dt-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  catch (e) { return "light"; }
})());

window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
// the autosave is debounced, so make sure a pending write lands on the way out
window.addEventListener("pagehide", flushSave);

/* No resize handler. There used to be one: the charts were sized from
   clientWidth in JS, so the dashboard had to re-render on every resize. With
   the charts gone, nothing on the page has a width JS knows about — the cards
   are a CSS grid and reflow by themselves. Dropping it also means rotating a
   phone no longer rebuilds every card. */

loadAutosave();
renderAll();

/* Pull on open, so the phone shows what the desktop entered. Deliberately only
   when this device has nothing unsynced: with local edits outstanding, a silent
   adopt would throw them away, so it says so and waits for you instead. Failure
   here is silent by design — no signal must leave a working offline app, not an
   error dialog over your data. */
if (syncCfg()) {
  setSyncBadge();
  (async () => {
    const c = syncCfg();
    try {
      const res = await ghGet(c);
      if (!res.ok) { setSyncBadge(res.missing ? "warn" : "warn", res.missing ? "No file in the repo yet" : res.msg); return; }
      const meta = lsGet(SYNC_META, {}) || {};
      if (res.sha === meta.sha) { setSyncBadge("ok"); return; }
      if (localChanged()) {
        setSyncBadge("warn", "Cloud has newer data, and this device has unsynced changes");
        toast("Cloud has newer data — open Sync to compare");
        return;
      }
      adoptRemote(res.text, res.sha);
      setSyncBadge("ok");
      toast("Updated from cloud");
    } catch (e) { setSyncBadge("warn", "Could not reach GitHub"); }
  })();
}
</script>
</body>
</html>
