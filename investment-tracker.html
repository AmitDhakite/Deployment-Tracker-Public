      text-align: left; flex: none; margin-right: auto;
    }
    /* Note can be long enough to need the wrap that a flex line would deny it */
    table.grid td[data-label="Note"] { display: block; text-align: left; }
    table.grid td[data-label="Note"]:empty { display: none; }
    table.grid td[data-label="Note"]::before { display: block; margin-bottom: 1px; }
    .row-act { padding-top: 7px !important; }

    /* The price windows opt OUT of the stacking above. Stacking is right for the
       ledger, whose rows carry six fields and a free-text note; these carry three
       short numbers and a one-word label, so the generic treatment turned four
       rows into four blocks about 120px tall — half a phone screen of table above
       a chart that is the point of the sheet. Four columns of eleven-point figures
       fit in 375px with room to spare, so the table simply stays a table. */
    table.grid.pspans { display: table; font-size: 11.5px; }
    table.grid.pspans thead { display: table-header-group; }
    table.grid.pspans tbody { display: table-row-group; }
    table.grid.pspans tr { display: table-row; padding: 0; }
    table.grid.pspans th, table.grid.pspans td {
      display: table-cell; padding: 5px 3px; border-bottom: 1px solid var(--gridline);
      font-size: inherit; font-weight: inherit; text-align: right;
    }
    table.grid.pspans th { font-size: 10.5px; }
    table.grid.pspans th:first-child, table.grid.pspans td:first-child {
      text-align: left; padding-left: 0; white-space: nowrap;
    }
    table.grid.pspans th:last-child, table.grid.pspans td:last-child { padding-right: 0; }
    table.grid.pspans td.mark { font-weight: 600; }
    table.grid.pspans tbody tr:last-child td { border-bottom: none; }
    /* the ::before labels are the stacked layout's; with the header row back they
       would print the column name inside every cell */
    table.grid.pspans td::before { content: none; display: none; }
  }
</style>

<div class="aura" aria-hidden="true"></div>
<div class="wrap">

  <header class="top glass">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>MONEY Follows Mah Brotha</h1>
    </div>
    <div class="top-actions">
      <span class="dot-unsaved" title="Unsaved changes"></span>
      <!-- Add is in the header rather than in a view so it is reachable from every
           tab, and an icon rather than a label because it is the one action whose
           glyph needs no explaining. -->
      <button class="btn sm iconbtn primary" id="btn-add"
              aria-label="Add bucket" title="Add bucket"><span class="ic-plus" aria-hidden="true"></span></button>
      <!-- Refresh is the one action that stays out in the bar at every width, and
           always: folding it in would cost a tap to open the menu and a tap to
           close whatever it left open, and its whole justification is being one
           tap — the alternative is reloading the page. It used to hide itself
           until sync was configured, on the grounds that a control which does
           nothing is worse than an absent one. Wrong trade twice over: a control
           that comes and goes is harder to trust than one that is always there,
           and the fix for "does nothing" is to give it something to do — with no
           cloud set up it opens the sync setup, which is what you would have
           wanted from it anyway. -->
      <button class="btn sm iconbtn" id="btn-refresh"
              aria-label="Refresh from GitHub" title="Refresh from GitHub">
        <span class="ic-refresh" aria-hidden="true">↻</span>
      </button>
      <!-- Everything you set once or reach for rarely lives behind this at every
           width: the sync setup and the light/dark switch. -->
      <button class="btn sm kebab" id="btn-menu" aria-label="Settings"
              title="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="top-menu">
        <span aria-hidden="true"></span>
      </button>
      <!-- No role="menu": that contract wants role="menuitem" children and arrow-key
           navigation, and half-implementing it reads worse to a screen reader than
           two plain buttons that already announce themselves. -->
      <div class="actions" id="top-menu">
        <button class="btn sm" id="btn-sync" title="Sync with a private GitHub repo">Sync</button>
        <button class="btn sm" id="btn-theme" title="Toggle light/dark">Dark</button>
      </div>
    </div>

    <button role="tab" aria-selected="false" data-view="plan">Plan</button>
    <button role="tab" aria-selected="false" data-view="ledger">Ledger</button>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   1. State + persistence
   ============================================================ */

const LS_KEY = "deployment-tracker-v1";
const DEFAULTS = () => ({
  version: 1,
  settings: { capMonths: 4 },
  buckets: [],
  purchases: [],
  skips: []
});

let S = DEFAULTS();
let fileHandle = null;
let dirty = false;

/* Prices live OUTSIDE S, in their own localStorage key, and this is the one
   design decision in the price feature that must not be undone. S is what gets
   written to data.json and pushed to the repo, so a price history parked in
   there would be uploaded on every buy, would grow the synced file by tens of
   kilobytes, and would be echoed back to every other device — which is exactly
   what the old `navCache` did, and why migrate() still deletes it on sight.

   It is a cache in the honest sense: derived, disposable, and replaceable from
   the network. Nothing in the plan depends on it, so losing it costs a refresh
   and never costs data.

   Loaded in boot() rather than here: lsGet is a `const` declared with the sync
   code far below, so calling it at this point in the top-level script would hit
   its temporal dead zone.

   Spelled out rather than shortened, because buyForm already has a local `P`
   (paidThrough) and a one-letter global that a function shadows is a bug waiting
   for whoever adds a price line to that form. */
const PRICES_KEY = "dt-prices";
let PRICES = null;

/* computeLedger walks every month since a bucket started, and four render
   paths each wanted it for every bucket. Memoised per render pass instead. */
const ledgerCache = new Map();
function ledgerOf(b) {
  let L = ledgerCache.get(b.id);
  if (!L) { L = computeLedger(b); ledgerCache.set(b.id, L); }
  return L;
}

function markDirty() {
  dirty = true; ledgerCache.clear();
  document.body.classList.add("dirty"); autosave();
  syncQueue();   // no-op unless cloud sync is configured
}
function markClean() { dirty = false; document.body.classList.remove("dirty"); }

/* The whole state is now small enough to stringify outright. It used to carry
   thousands of daily NAV points per linked fund, which is why there was a
   persistable() that kept only the tail; with no price history left, the state
   is a plan plus a purchase log and that is kilobytes. The write is still
   debounced so it lands after the interaction rather than during it. */
let saveT;
function flushSave() {
  // only ever writes a save that is actually pending — never invents one, so
  // an unload can't overwrite good stored data with a state that never loaded
  if (!saveT) return;
  clearTimeout(saveT); saveT = null;
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* quota / file:// */ }
}
function autosave() { clearTimeout(saveT); saveT = setTimeout(flushSave, 500); }
function loadAutosave() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { S = migrate(Object.assign(DEFAULTS(), JSON.parse(raw))); return true; }
  } catch (e) {}
  return false;
}

async function saveToFile() {
  const json = JSON.stringify(S, null, 2);
  if (window.showSaveFilePicker) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: "investment-plan.json",
          types: [{ description: "JSON", accept: { "application/json": [".json"] } }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      markClean(); toast("Saved");
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
      fileHandle = null; // fall through to download
    }
  }
  const blob = new Blob([json], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "investment-plan.json";
  a.click();
  URL.revokeObjectURL(a.href);
  markClean(); toast("Downloaded investment-plan.json");
}

async function loadFromFile() {
  if (window.showOpenFilePicker) {
    try {
      const [h] = await window.showOpenFilePicker({
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }]
      });
      const text = await (await h.getFile()).text();
      applyLoaded(text); fileHandle = h;
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
    }
  }
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => { if (inp.files[0]) applyLoaded(await inp.files[0].text()); };
  inp.click();
}

/* Files and localStorage written before the price machinery was removed carry
   a `source` object instead of a plain `tracks` string, and the fund name lived
   inside it. Without this, every card from an older save silently loses its
   subtitle and reads "no description" — the data is right there, so carry it
   across rather than making you retype it. It only ever fills a blank, so
   running it on every load cannot overwrite something you have since edited.

   `source` itself is live again and is NOT touched here: the price feed reads the
   same field the old code wrote, which is why four funds that have carried their
   scheme codes through all of this need no migration and started returning prices
   the moment the workflow ran. `source.schemeName` is live again too, written by
   the fund picker so a bucket linked one minute ago can already name its fund;
   once prices arrive the feed's own name is what gets displayed, because that is
   the one that proves what was actually fetched.

   What it deliberately does NOT do is delete the other leftovers. targetPrice
   and priceLog are numbers you typed by hand; nothing reads them any more, but
   dropping them would destroy input you can't get back, and a few unread keys
   in a kilobyte-sized file cost nothing. navCache is the one exception — it was
   never your data, just a copy of mfapi's, and it is the only part that was
   ever large. */
function migrate(st) {
  for (const b of st.buckets || []) {
    if (!b.tracks) {
      const s = b.source || {};
      b.tracks = s.schemeName || s.symbol || "";
    }
  }
  delete st.navCache;
  return st;
}

function applyLoaded(text) {
  try {
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.buckets)) throw new Error("Not a plan file");
    S = migrate(Object.assign(DEFAULTS(), data));
    markClean(); autosave(); renderAll(); toast("Plan loaded");
  } catch (e) { alert("Could not read that file: " + e.message); }
}

/* ============================================================
   2. Small helpers
   ============================================================ */

const uid = () => Math.random().toString(36).slice(2, 10);

const inr = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 });
const fmt  = n => "₹" + inr.format(Math.round(n || 0));
/* Always two places, never dropped. A dollar bucket's ledger holds real buy
   amounts — three shares at $47.12 — so unlike rupees the fraction is part of
   the figure, and a column where $1,200 and $141.36 have different numbers of
   decimals stops lining up under tabular-nums. Both bounds are set because left
   to choose for itself Intl prints "$250.5". */
const usdFmt = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd = n => "$" + usdFmt.format(Number(n) || 0);

/* A bucket's currency denominates its whole ledger — the budget, the opening
   backlog, the monthly lots, the lapses and the pending figure are all in it —
   so nearly every figure in this file is "an amount, in some bucket's currency"
   rather than an amount in rupees. money() is that pair, and ccyOf() reads the
   currency off a bucket, defaulting to INR so a plan written before the field
   existed still loads. Nothing here converts one into the other; see renderHero
   for why not. */
const ccyOf = b => (b && b.currency === "USD") ? "USD" : "INR";
const money = (n, ccy) => ccy === "USD" ? usd(n) : fmt(n);

/* The display-size form of money(): the same string, but the currency mark and
   the grouping separators become their own nodes so the .cur / .sep rules can
   set them as notation instead of as numerals. See that rule for why.
   Only for the places a figure is set 17px or larger — the hero totals, the
   hero side stats and the card's pending amount. Everywhere else keeps money(),
   which stays a plain string: the tables are 13px, where the inline glyph is
   already correctly proportioned, and a string is what a title= or an alert can
   take. Reading the characters back out of money()'s own output rather than
   reformatting means there is one number format in this file, not two that can
   drift; and that output is digits, separators and a single ₹ or $, so it needs
   no escaping. The mark is matched anchored, so a $ is never mistaken for the
   $1 backreference syntax and the replacer is a function besides. */
const moneyBig = (n, ccy) => money(n, ccy)
  .replace(/^[₹$]/, s => `<span class="cur">${s}</span>`)
  .replace(/,/g, '<span class="sep">,</span>');

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
const thisMonth = () => todayISO().slice(0, 7);

const mIdx = ms => { const [y, m] = ms.split("-").map(Number); return y * 12 + (m - 1); };
const mStr = i => Math.floor(i / 12) + "-" + String((i % 12) + 1).padStart(2, "0");
const mLabel = ms => { const [y, m] = ms.split("-").map(Number); return MON[m - 1] + " " + y; };
/* "Jul" inside the current year, "Dec 2026" outside it. The buy sheet puts a
   month on every button, and the year is noise eleven times out of twelve — but
   dropping it always would make January's view of last December ambiguous. */
const mShort = ms => {
  const [y, m] = ms.split("-").map(Number);
  return MON[m - 1] + (y === Number(thisMonth().slice(0, 4)) ? "" : " " + y);
};

function dLabel(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-").map(Number);
  return d + " " + MON[m - 1] + " " + y;
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let toastT;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ============================================================
   3. Ledger engine
   ------------------------------------------------------------
   Monthly budget is credited on the 1st of each month as a "lot".
   Purchases consume lots FIFO (oldest money first).
   A lot expires — "lapses" — at the start of month + capMonths,
   which is what caps carry-forward at capMonths of budget.
   Buying more than the pending balance creates an "advance" that
   is absorbed by future credits.
   ============================================================ */

function allocFor(b, month) {
  let amt = 0, best = -1;
  for (const a of (b.allocations || [])) {
    const i = mIdx(a.from);
    if (i <= mIdx(month) && i > best) { best = i; amt = Number(a.amount) || 0; }
  }
  return amt;
}

function purchasesOf(id) {
  return S.purchases.filter(p => p.bucketId === id)
                    .sort((a, b) => a.date.localeCompare(b.date));
}

/* What a purchase takes out of its bucket's lots, in the bucket's own currency.
   A dollar bucket is funded in dollars, so a dollar buy consumes its dollar
   amount; `amountInr` on that record is a note of what actually left the bank at
   the rate of the day, not a figure the ledger balances against. Reading it the
   other way round — dollar lots credited from a rupee budget and drained by a
   rupee conversion — was the bug: $500 against a 500 budget cleared forty-odd
   months at once, or none, depending on which unit you had typed. */
const deployedOf = (b, p) => ccyOf(b) === "USD"
  ? (Number(p.rawAmount) || 0)
  : (Number(p.amountInr) || Number(p.rawAmount) || 0);

/* Below this, a balance is not money — it is binary floating point.
   Five $5.55 lots drained by one $27.75 buy leave 1.78e-15 in the last one,
   because 5.55 has no exact double and the subtractions do not cancel. The card
   then printed "$0 pending" beside "This month still to invest", which is the
   same bug reported twice: the number rounded to nothing and the test did not.
   Half a cent is the threshold because a cent is the smallest amount either
   currency can actually settle, so anything under half of one cannot be a real
   debt — and it is far above any residue a few dozen subtractions can produce.
   Rounding the lots themselves instead would be wrong: it changes what is owed
   to make the display agree, which is the tail wagging the dog. */
const ZERO = 0.005;

function computeLedger(b) {
  const cap = Number(S.settings.capMonths) || 4;
  const start = b.start || (b.allocations && b.allocations[0] && b.allocations[0].from) || thisMonth();
  const s = mIdx(start), e = mIdx(thisMonth());   // s > e ⇒ not started yet, loop is skipped
  const px = purchasesOf(b.id);

  let pi = 0, advance = 0, credited = 0, deployed = 0, lapsedTotal = 0;
  const lots = [], rows = [], lapses = [];

  for (let i = s; i <= e; i++) {
    const m = mStr(i);

    // (1) expire lots that have reached the cap age
    let lapsedThis = 0;
    for (const lot of lots) {
      if (lot.left > 0 && mIdx(lot.month) <= i - cap) { lapsedThis += lot.left; lot.left = 0; }
    }
    if (lapsedThis > 0) { lapses.push({ month: m, amount: lapsedThis }); lapsedTotal += lapsedThis; }

    // (2) credit this month (opening backlog rides the first month)
    let credit = allocFor(b, m);
    if (i === s && Number(b.openingPending) > 0) credit += Number(b.openingPending);
    credited += credit;
    let net = credit;
    if (advance > ZERO && net > 0) {
      const use = Math.min(advance, net); advance -= use; net -= use;
      if (advance < ZERO) advance = 0;
    }
    if (net > ZERO) lots.push({ month: m, amount: credit, left: net });

    // (3) purchases up to and including this month, oldest first.
    //     "<=" not "===" so a buy dated before the tracking start still lands in a row
    //     and the month table reconciles with the totals.
    let deployedThis = 0;
    while (pi < px.length && px[pi].date.slice(0, 7) <= m) {
      let amt = deployedOf(b, px[pi]);
      deployedThis += amt; deployed += amt;
      for (const lot of lots) {
        if (amt <= ZERO) break;
        if (lot.left > 0) {
          const take = Math.min(lot.left, amt); lot.left -= take; amt -= take;
          if (lot.left < ZERO) lot.left = 0;   // a fully-paid month, said exactly
        }
      }
      if (amt > ZERO) advance += amt;   // bought ahead of budget
      pi++;
    }

    rows.push({
      month: m, credited: credit, deployed: deployedThis, lapsed: lapsedThis,
      balance: lots.reduce((t, l) => t + l.left, 0)
    });
  }

  // Future-dated purchases: still deployed, folded into the latest row so the table reconciles.
  let ahead = 0;
  for (; pi < px.length; pi++) {
    const amt = deployedOf(b, px[pi]);
    deployed += amt; ahead += amt;
    let rest = amt;
    for (const lot of lots) {
      if (rest <= ZERO) break;
      if (lot.left > 0) {
        const take = Math.min(lot.left, rest); lot.left -= take; rest -= take;
        if (lot.left < ZERO) lot.left = 0;
      }
    }
    if (rest > ZERO) advance += rest;
  }
  if (ahead > 0 && rows.length) {
    const last = rows[rows.length - 1];
    last.deployed += ahead;
    last.balance = lots.reduce((t, l) => t + l.left, 0);
  }

  const open = lots.filter(l => l.left > ZERO);
  const pending = open.reduce((t, l) => t + l.left, 0);
  if (advance < ZERO) advance = 0;   // same reason: never "Paid ahead by $0.00"
  const oldest = open.length ? open.reduce((a, l) => (mIdx(l.month) < mIdx(a.month) ? l : a)) : null;
  const notStarted = s > e;
  const monthly = notStarted ? allocFor(b, start) : allocFor(b, thisMonth());

  return {
    /* Every figure below is in this currency. Carried on the ledger rather than
       looked up from the bucket at each call site, because most of them — the
       status badge, the buy sheet, the month buttons — only ever hold an L. */
    ccy: ccyOf(b),
    pending, monthly, cap, capAmount: monthly * cap, advance, notStarted, startMonth: start,
    // The surviving month-by-month lots, oldest first — what a partial buy eats
    // into, and what the month buttons on the buy sheet are built from. `amount`
    // is the full credit and `left` what is still owed, so left < amount marks a
    // month that is part-paid rather than untouched.
    openLots: open.map(l => ({ month: l.month, amount: l.amount, left: l.left }))
                  .sort((a, c) => a.month.localeCompare(c.month)),
    oldestMonth: oldest ? oldest.month : null,
    /* Two different numbers, and mixing them up reads as a bug on the card.
       `openMonths` is HOW MANY months still owe something — the count to put in
       words, because "2 months behind" is how anyone reads ₹20,000 at ₹10,000 a
       month. `ageMonths` is HOW OLD the oldest of them is, which is the only
       thing that predicts lapsing (a lot expires at month + cap). They differ by
       one whenever the current month is also unbought, i.e. most of the time.
       Counting lots rather than dividing pending by `monthly` is deliberate:
       `monthly` is today's allocation, older lots may have been credited at a
       different one, and a part-paid month would divide into a fraction. */
    openMonths: open.length,
    ageMonths: oldest ? Math.max(0, mIdx(thisMonth()) - mIdx(oldest.month)) : 0,
    lapses, lapsedTotal, credited, deployed, rows
  };
}

/* Money still sitting in a bucket is never green. The plan is to invest every
   month, so this month's un-deployed credit is already something to act on,
   and once a whole month has passed it is a backlog rather than a "wait" —
   the old rule called a full month's delay "On track" with a green tick. Green
   now means one thing: nothing is waiting. */
function statusOf(L) {
  const cap = L.cap;
  if (L.notStarted)     return { key: "idle",  st: "--st-idle", ic: "•", label: "Starts " + mLabel(L.startMonth) };
  if (L.monthly <= 0)   return { key: "idle",  st: "--st-idle", ic: "•", label: "No budget set" };
  if (L.pending <= 0)   return { key: "clear", st: "--st-good",    ic: "✓",
                                 label: L.advance > 0 ? "Paid ahead by " + money(L.advance, L.ccy) : "Fully deployed" };
  /* The number in the words is the COUNT of unbought months; the thresholds are
     the AGE of the oldest one. Using the age for both said "1 month behind" on a
     bucket holding two unbought months, because the current month contributes
     money without contributing any age. */
  const n = L.openMonths;
  const mo = n + " month" + (n === 1 ? "" : "s");
  if (L.ageMonths >= cap - 1) return { key: "cap", st: "--st-critical", ic: "✕", label: mo + " behind · lapsing now" };
  if (L.ageMonths >= 1)       return { key: "act", st: "--st-serious",  ic: "▲", label: mo + " behind" };
  return { key: "due", st: "--st-warning", ic: "!", label: "This month still to invest" };
}

const RANK = { cap: 0, act: 1, due: 2, clear: 3, idle: 4 };

/* Three categories, in the order the dashboard stacks them. They are also the
   only three: "Group of holdings" is gone, and with it the editable member list
   that was its whole reason for existing — a fourth category that only enabled a
   sub-form is not a category.

   Legacy values are mapped, never rejected, because a bucket whose kind does not
   resolve would vanish from a grouped dashboard rather than sit in the wrong
   group. The old `equity` ("Single stock") and `group` ("Group of holdings") both
   became a stock row, and which one is decided by the currency: a dollar holding
   is not an Indian stock, and half the dollar holdings in a real file are tagged
   `mf` anyway, because the old three categories had nowhere better to put an ETF.
   Anything unrecognised falls to mf rather than to a fourth bin, so every bucket
   is always in exactly one group.

   Stored `members` are left on the record untouched — unread, not deleted. */
/* The one icon in this file that is drawn rather than typed. ✎ and ✏ are exactly
   the characters that come out as tofu on one phone and as a full-colour emoji on
   the next, and a pencil that renders as a box is worse than the word "Edit" it
   replaced. currentColor, so it follows the button through both themes and the
   hover state, and stroke-only so it costs no fill at 16 cards. */
const ICON_PENCIL = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none"
  stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
  stroke-linejoin="round" aria-hidden="true" focusable="false"
  ><path d="M16.8 3.2a2.83 2.83 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5 13.3-13.3z"/></svg>`;

const KINDS = { mf: "Mutual Funds", in_stock: "Indian Stocks", us_stock: "US Stocks" };
const KIND_ORDER = ["mf", "in_stock", "us_stock"];
const kindOf = b => {
  if (KINDS[b.kind]) return b.kind;
  if (b.kind === "equity" || b.kind === "group") return ccyOf(b) === "USD" ? "us_stock" : "in_stock";
  return "mf";
};

/** What a bucket tracks, in words. Free text, independent of the price feed:
    `tracks` is your own description, `source` is the machine-readable link. They
    are separate on purpose — renaming your note must never break the prices, and
    a feed's official name ("ICICI Prudential Nifty 50 Index Fund - Direct Plan -
    Cumulative") is not what you want to read on a card. */
function tracksLabel(b) {
  return (b.tracks || "").trim() || "no description";
}

/* ============================================================
   4. Prices — where a holding sits in its own recent range

   The question this answers is "is this cheap right now, by its own recent
   standards", which is a different question from "how much do I owe it" that
   the rest of the app is about. It is deliberately not a portfolio valuation:
   nothing here multiplies a price by a quantity, because the app does not track
   quantities and pretending otherwise would be the most misleading thing it
   could do.

   Nothing in here fetches. prices.json is built once a day by a workflow in the
   private repo and read in section 11 — see the comment there for why a browser
   cannot do this itself. Everything below is pure computation over that file.
   ============================================================ */

/* Calendar days back, not trading days: "6-month low" is a claim about the last
   six months of the year, and a reader does not care that one of them had more
   public holidays than another. */
const PRICE_WINDOWS = [
  { key: "1m",  days: 30,  label: "1-month"  },
  { key: "3m",  days: 91,  label: "3-month"  },
  { key: "6m",  days: 182, label: "6-month"  },
  { key: "12m", days: 365, label: "12-month" }
];

/* Why a tolerance at all: "exactly the lowest close" almost never fires, and a
   price 0.2% above its six-month low is at its six-month low by any human
   reading. Why two tests rather than one:

   NEAR_EDGE is a share of the window's own range, so it self-scales — the
   bottom 6% of a range that spans 40% of the price is a much wider band in
   rupees than the bottom 6% of one that spans 3%.
   ABS_SLACK catches the case NEAR_EDGE handles badly: in a very tight range,
   6% of it can be a rounding error, so being within 0.5% of the actual extreme
   qualifies regardless.
   MIN_RANGE is the guard the other two need. Position inside a range narrower
   than 2% of the price is noise being read as signal — measured on real data,
   a fund whose month spanned 1.5% was ranked at "95% of its 1-month range",
   which sounds like a high and means nothing. Below that width the position
   test is refused and only the absolute test may fire. */
const NEAR_EDGE = 0.06;
const ABS_SLACK = 0.005;
const MIN_RANGE = 0.02;

/** The feed key for a bucket, or "" if it has not been linked to one.
    Kept in `source` — the same field the pre-2026 version used — so the four
    funds that still carry their scheme codes need no migration at all. */
function priceKey(b) {
  const s = (b && b.source) || {};
  if (s.type === "mfapi" && s.schemeCode) return String(s.schemeCode);
  if (s.type === "yahoo" && (s.symbol || "").trim()) return s.symbol.trim().toUpperCase();
  return "";
}

/** The default feed for a kind. Indian funds are on mfapi (which is the only
    free source that covers them at all); everything listed is on Yahoo. */
const feedFor = kind => (kind === "mf" ? "mfapi" : "yahoo");

/* ---- the editor's side of `source`: one text field, both feeds ----
   The stored shape stays as it was ({type, schemeCode} / {type, symbol}) because
   the workflow already reads it and the four funds already carry it. What the
   editor shows is a single string, and srcParse decides what it meant. */

const srcText = b => priceKey(b);

/** Text from the field back into a source record, or null for "not tracked".
    All digits is a scheme code; anything else is a ticker. An Indian listing gets
    ".NS" appended when it has no suffix, because GOLDBEES on its own resolves to
    nothing on Yahoo while GOLDBEES.NS is the NSE line — and a symbol that already
    carries a dot is left exactly as typed, since .BO, .L and .DE are all real.

    `name` is the fund name the picker confirmed, and it is carried only when it
    belongs to the code in the field — retype the code by hand and the old name is
    dropped rather than left attached to a different fund. The workflow ignores
    this field entirely; it exists so the editor and the card can name the chosen
    fund before any price has been fetched. */
function srcParse(text, kind, name) {
  const t = (text || "").trim();
  if (!t) return null;
  if (/^\d+$/.test(t)) {
    const s = { type: "mfapi", schemeCode: Number(t) };
    if ((name || "").trim()) s.schemeName = name.trim();
    return s;
  }
  let sym = t.toUpperCase().replace(/\s+/g, "");
  if (kind === "in_stock" && !sym.includes(".")) sym += ".NS";
  return { type: "yahoo", symbol: sym };
}

/** What the feed said, or why there is nothing yet. This is the whole
    verification story for a ticker: the browser cannot check one itself (Yahoo
    sends no CORS header, which is why the workflow exists), so the only proof
    that AAPL is Apple and not a typo that happens to resolve is the name the
    fetch brought back. */
function srcHint(b) {
  const key = priceKey(b);
  if (!key) return "Leave it empty and this bucket simply has no price row.";
  const err = ((PRICES || {}).errors || {})[key];
  if (err) return `The feed rejected <b>${esc(key)}</b>: ${esc(err)}`;
  const entry = ((PRICES || {}).series || {})[key];
  if (entry) return `✓ <b>${esc(entry.name)}</b> — that is what the last refresh actually fetched.`;
  /* A picked fund can name itself here straight away; a typed ticker cannot, and
     saying so is the honest version. Both end up at the same place once the
     workflow has run, and then the line above replaces this one. */
  const picked = ((b.source || {}).schemeName || "").trim();
  if (picked) return `<b>${esc(picked)}</b>, confirmed against the fund list.
    Its prices arrive on the next refresh.`;
  return `Not fetched yet. The name it resolves to appears here after the next refresh —
    that is how you catch a ticker that is real but not yours.`;
}

/** Everything the UI needs about one bucket's price, or null if it has no
    series yet. Pure: same prices in, same object out, no rendering.

    Returns { key, name, ccy, day, price, stale, spans[], best, ctx }
    where `best` is the strongest true claim and `ctx` is always the longest
    window available, because the two together are what stop `best` from lying —
    see the comment on `best` below. */
function priceView(b) {
  const key = priceKey(b);
  if (!key || !PRICES || !PRICES.series) return null;
  const entry = PRICES.series[key];
  if (!entry) return null;
  const days = (PRICES.cal || {})[entry.cal] || [];
  const closes = entry.c || [];

  /* Nulls are days this instrument did not trade while another on the same
     calendar did. Dropping them is what makes a fund holiday a gap rather than
     a fake flat line through it. */
  const pts = [];
  for (let i = 0; i < days.length && i < closes.length; i++) {
    if (closes[i] != null) pts.push({ d: days[i], c: closes[i] });
  }
  if (pts.length < 5) return null;

  const last = pts[pts.length - 1];
  const price = last.c;
  const refMs = Date.parse(last.d + "T00:00:00Z");

  const spans = [];
  for (const w of PRICE_WINDOWS) {
    const cut = new Date(refMs - w.days * 86400000).toISOString().slice(0, 10);
    const win = pts.filter(p => p.d >= cut);
    /* Under five points a "low" is an opinion about four numbers. A bucket
       linked last week therefore shows nothing rather than something wrong. */
    if (win.length < 5) continue;
    let lo = Infinity, hi = -Infinity;
    for (const p of win) { if (p.c < lo) lo = p.c; if (p.c > hi) hi = p.c; }
    const range = hi - lo;
    const wide = price > 0 && range / price >= MIN_RANGE;
    const pos = range === 0 ? 0.5 : (price - lo) / range;
    let dir = "";
    if ((wide && pos <= NEAR_EDGE) || price <= lo * (1 + ABS_SLACK)) dir = "low";
    else if ((wide && pos >= 1 - NEAR_EDGE) || price >= hi * (1 - ABS_SLACK)) dir = "high";
    spans.push({ ...w, lo, hi, pos, wide, dir, n: win.length, from: win[0].d });
  }
  if (!spans.length) return null;

  /* The longest qualifying window wins REGARDLESS of direction, and that last
     part is the whole subtlety. Lows only nest downward: a 6-month low is
     necessarily also a 1-month low, but a 1-month low says nothing about six
     months. Picking "the longest low, else the longest high" therefore reports
     "1-month low" for a fund sitting at 88% of its 12-month range — measured on
     real data, three of four funds did exactly that — which reads as a bargain
     and is nearly the opposite of true. Ranking every claim, both directions, by
     window length puts the more significant fact first.

     It still cannot make a short claim tell the whole story, so it is never
     shown alone: `ctx` below is the position in the longest window, and that
     percentage is printed beside the claim on every card. It used to also drive
     the badge's colour, which is now the price direction instead (see
     priceTone), so this sentence is the only thing left holding a
     technically-true "1-month low" to its actual size. It is not optional. */
  const claimed = spans.filter(s => s.dir);
  const best = claimed.length ? claimed.reduce((a, s) => (s.days > a.days ? s : a)) : null;
  const ctx = spans[spans.length - 1];

  /* Prices go stale silently — a disabled workflow, a revoked token, a symbol
     that started 404ing — and a stale low is worse than no low, so the age of
     the newest close travels with the reading and the UI says so past a week. */
  const ageDays = Math.floor((Date.now() - refMs) / 86400000);

  return { key, name: entry.name || key, ccy: entry.ccy || "", feed: entry.feed || "",
           day: last.d, price, ageDays, stale: ageDays > 7, spans, best, ctx, pts };
}

/** Which direction the price is in: "low" (red) or "high" (green).

    ANY window at its low makes it red, not just the longest one — that is the
    rule as asked for, and it is the cautious reading anyway. It matters because
    the two directions can co-occur: a thing that has barely moved this month
    while sitting at the top of its year can satisfy the 1-month low test and the
    12-month high test at once, and in that case the low is the fact you would
    want the graph to admit.

    Green is therefore "no window is at its low", which includes plain mid-range.
    A two-state signal has no neutral, so mid-range has to fall on one side;
    green is the side that does not cry low. */
function priceTone(v) {
  if (!v || !v.spans) return "high";
  return v.spans.some(s => s.dir === "low") ? "low" : "high";
}

/** A single-series line, as one static SVG.

    Not a chart: no axes, no grid, no hover, no legend — a legend for one series
    restates the label beside it, and a crosshair on 92px of width would be a
    hit target you cannot hit. It is a shape that makes the badge's claim
    visible, and every number it implies is written out next to it in text, so
    nothing here is the only way to read a value. The full chart with labelled
    extremes and a readout is one tap away in priceSheet().

    All of it is static: one path, one circle, no transition, no filter. That is
    what lets sixteen of these sit on a scrolling page — see the stylesheet
    header on why anything that moves is the expensive thing. */
function sparkline(pts, opts) {
  const o = opts || {};
  const w = o.w || 96, h = o.h || 32;
  /* The end dot is r=4 with a 2px ring, so it needs 6px of room or it clips at
     the top and bottom of the box — exactly where a series at its high or low
     puts it, which is the case that matters most. */
  const pad = 6;
  if (!pts || pts.length < 2) return "";
  let lo = Infinity, hi = -Infinity;
  for (const p of pts) { if (p.c < lo) lo = p.c; if (p.c > hi) hi = p.c; }
  const span = hi - lo || 1;
  const innerW = w - pad * 2, innerH = h - pad * 2;
  const x = i => pad + (pts.length === 1 ? innerW / 2 : innerW * i / (pts.length - 1));
  const y = c => pad + innerH - ((c - lo) / span) * innerH;
  /* One decimal on the coordinates: at this size the second decimal is a tenth
     of a pixel and it is ~1.3 KB of path string per card. */
  const d = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.c).toFixed(1)).join("");
  const lastX = x(pts.length - 1).toFixed(1), lastY = y(pts[pts.length - 1].c).toFixed(1);
  /* No preserveAspectRatio: the viewBox and the width/height are the same numbers,
     so this never scales and the stroke is 2 real pixels. It is why the text in
     the detail sheet's chart is measured in JS instead — the same trick at modal
     width would shrink 11px axis labels to 7px on a phone. */
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"
    aria-hidden="true" focusable="false"
    ><path class="sl" d="${d}"/><circle class="sd" cx="${lastX}" cy="${lastY}" r="4"/></svg>`;
}

/** Every nth point, keeping the first and always the last.

    The card sparkline draws the SAME window the sentence beside it names, which
    for a year is ~246 points — about 3 KB of path string per card, 48 KB across
    sixteen, rebuilt on every render. Striding to 64 is invisible at 96px wide
    (a 12-month line has one point every 1.4px there, so three out of four
    coordinates land on a pixel already occupied) and keeps a render cheap. The
    last point is forced back in because it is where the end dot goes, and the end
    dot is the one point whose exact position the whole row is about. */
function thin(pts, max) {
  if (pts.length <= max) return pts;
  const step = Math.ceil(pts.length / max);
  const out = pts.filter((_, i) => i % step === 0);
  if (out[out.length - 1] !== pts[pts.length - 1]) out.push(pts[pts.length - 1]);
  return out;
}

/** The price block on a card: the claim, the shape, and the context that stops
    the claim from being read as more than it is.

    Silent when a bucket has no source, and silent when the feed has no series
    for it yet. A row saying "no price data" on fifteen cards would be fifteen
    lines of nothing, and the place to fix it is the editor, which says so. */
function priceRow(b) {
  const v = priceView(b);
  if (!v) return "";
  const tone = priceTone(v);
  const claim = v.best ? `${v.best.label} ${v.best.dir}` : "mid-range";
  /* The context sentence is always the longest window, and it is always shown,
     including when it undercuts the badge beside it — especially then. */
  const ctxPct = Math.round(v.ctx.pos * 100);
  return `<button class="pricerow tone-${tone}" onclick="priceSheet('${b.id}')"
      aria-label="${esc(v.name)}: ${claim}, ${ctxPct}% of its ${v.ctx.label} range. Open chart.">
      <span class="pclaim">${claim}</span>
      ${/* The longest window, the same one the sentence to the right measures
            against — a graph showing a different span from the number printed
            beside it is a chart that argues with its own caption. */
        sparkline(thin(v.pts.filter(p => p.d >= v.ctx.from), 64))}
      <span class="pctx">${ctxPct}% of ${v.ctx.label}${v.stale ? " · stale" : ""}</span>
    </button>`;
}

/* ---------- the detail sheet ----------
   One chart, one series, four windows selected by a toggle. The toggle lives in
   here rather than on the card for the usual reason: a filter inside a chart card
   on a dashboard leaves sixteen cards each showing a different slice of time, and
   nothing on screen says so. In a sheet you opened about one instrument there is
   only one chart for it to scope, and it is the question you came to ask. */

/* Prices need two decimals, so money() cannot be used: fmt() rounds rupees to
   whole numbers, which turns a NAV of 74.83 into ₹75 and a 0.2% move into
   nothing. Grouping still follows the market's own convention — Indian lakhs
   for INR, thousands for USD. */
const PNUM = {};
function pnum(n, ccy) {
  const c = ccy === "USD" ? "USD" : ccy === "INR" ? "INR" : "";
  if (!PNUM[c]) PNUM[c] = new Intl.NumberFormat(c === "INR" ? "en-IN" : "en-US",
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (c === "INR" ? "₹" : c === "USD" ? "$" : "") + PNUM[c].format(Number(n) || 0);
}

/* Drawn at the container's own pixel width, so nothing is scaled: a viewBox that
   stretched to fit would take 11px axis text down to 7px on a 375px phone, which
   is the sort of thing that looks fine in a screenshot at desktop width and is
   unreadable on the device it is for. The cost is that the chart is sized once,
   at draw time — a rotate mid-view leaves it at the old width until the toggle
   redraws it, which is a fair trade for text that is always the size it says. */
function drawSheetChart(host, v, spanKey) {
  const span = v.spans.find(s => s.key === spanKey) || v.ctx;
  const pts = v.pts.filter(p => p.d >= span.from);
  if (pts.length < 2) { host.innerHTML = `<p class="muted">Not enough history for this window.</p>`; return; }

  const w = Math.max(240, Math.round(host.clientWidth || 460));
  const plotH = 150, axisH = 22, padT = 16;
  const h = padT + plotH + axisH;
  const padL = 2, padR = 2;
  const innerW = w - padL - padR;

  /* Scaled to the window's own low and high, with a small margin so the extremes
     are not drawn on the frame. Never zero-based: the question is "where in its
     recent range is this", and a ₹0 baseline squashes a year of a ₹250 fund into
     the top inch of the box where no move is visible. */
  const pad = (span.hi - span.lo) * 0.08 || (span.hi * 0.01) || 1;
  const lo = span.lo - pad, hi = span.hi + pad;
  const X = i => padL + (pts.length === 1 ? innerW / 2 : innerW * i / (pts.length - 1));
  const Y = c => padT + plotH - ((c - lo) / (hi - lo)) * plotH;

  const xs = pts.map((_, i) => X(i));
  const ys = pts.map(p => Y(p.c));
  const d = pts.map((p, i) => (i ? "L" : "M") + xs[i].toFixed(1) + " " + ys[i].toFixed(1)).join("");
  const area = d + `L${xs[xs.length - 1].toFixed(1)} ${padT + plotH}L${xs[0].toFixed(1)} ${padT + plotH}Z`;

  let iLo = 0, iHi = 0;
  pts.forEach((p, i) => { if (p.c < pts[iLo].c) iLo = i; if (p.c > pts[iHi].c) iHi = i; });
  const iEnd = pts.length - 1;

  /* Three labels, not one per point: the two extremes and today. Everything else
     is in the table below, which is the chart's WCAG-clean twin. The low and high
     labels sit above their own gridline and are pulled back from either edge so
     they cannot run out of the box. */
  const clampX = (x, wide) => Math.min(Math.max(x, wide / 2 + 2), w - wide / 2 - 2);
  /* Both labels sit ABOVE their own rule, including the low one. Below looked
     tidier until it was rendered: the 8% scale margin puts the low rule about
     12px off the plot floor, so a label under it lands in the x-axis band and
     reads as a second line of dates. Above, it is 5px inside the plot at the far
     left, where the series is nowhere near its minimum. */
  const gridline = (c, cls, text) => {
    const y = Y(c);
    return `<line class="pgrid" x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}"/>
      <text class="plab ${cls}" x="${padL + 2}" y="${(y - 5).toFixed(1)}">${text}</text>`;
  };

  /* Measured, not hoped for: the label is centred on the end dot and then pulled
     back until its own box is inside the frame, so it is never clipped and never
     needs overflow hidden to hide the fact. 6.4px per character is this face's
     digit advance at 11px semibold. */
  const endLabel = pnum(pts[iEnd].c, v.ccy);
  const endX = clampX(xs[iEnd], endLabel.length * 6.4 + 8);

  host.innerHTML = `
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img"
      aria-label="${esc(v.name)}, ${span.label} price history: low ${pnum(span.lo, v.ccy)}, high ${pnum(span.hi, v.ccy)}, latest ${endLabel}. The same figures are in the table below.">
      ${gridline(span.hi, "hi", pnum(span.hi, v.ccy) + " high")}
      ${gridline(span.lo, "lo", pnum(span.lo, v.ccy) + " low")}
      <path class="parea" d="${area}"/>
      <path class="pline" d="${d}"/>
      <g id="ch-live" hidden>
        <line class="pchair" y1="${padT}" y2="${padT + plotH}"/>
        <circle class="pdot" r="4"/>
      </g>
      <circle class="pdot" cx="${xs[iLo].toFixed(1)}" cy="${ys[iLo].toFixed(1)}" r="3.5"/>
      <circle class="pdot" cx="${xs[iHi].toFixed(1)}" cy="${ys[iHi].toFixed(1)}" r="3.5"/>
      <circle class="pdot" cx="${xs[iEnd].toFixed(1)}" cy="${ys[iEnd].toFixed(1)}" r="4.5"/>
      <text class="pend" x="${endX.toFixed(1)}" y="${Math.max(11, ys[iEnd] - 10).toFixed(1)}"
        text-anchor="middle">${endLabel}</text>
      <text class="plab" x="${padL + 2}" y="${h - 6}">${dLabel(pts[0].d)}</text>
      <text class="plab" x="${w - padR - 2}" y="${h - 6}" text-anchor="end">${dLabel(pts[iEnd].d)}</text>
    </svg>
    <div class="ptip" hidden></div>`;

  // --- crosshair. Nearest point by x, so there is nothing to land on precisely.
  const svg = host.querySelector("svg");
  const live = host.querySelector("#ch-live");
  const chair = live.querySelector("line");
  const dot = live.querySelector("circle");
  const tip = host.querySelector(".ptip");
  /* The attribute, not the property. `el.hidden = false` is HTMLElement's, and
     the crosshair group is an SVGElement — assigning to it there sets a plain JS
     property, leaves the attribute in place, and [hidden]{display:none} keeps
     winning. The tooltip is a div and would have worked either way; doing both
     the same way is what stops that from being the difference nobody sees. */
  const show = (el, on) => on ? el.removeAttribute("hidden") : el.setAttribute("hidden", "");
  const move = e => {
    const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) * (w / r.width);
    let i = 0, best = Infinity;
    for (let k = 0; k < xs.length; k++) { const g = Math.abs(xs[k] - x); if (g < best) { best = g; i = k; } }
    chair.setAttribute("x1", xs[i]); chair.setAttribute("x2", xs[i]);
    dot.setAttribute("cx", xs[i]); dot.setAttribute("cy", ys[i]);
    show(live, true);
    tip.innerHTML = `<b>${pnum(pts[i].c, v.ccy)}</b> <span class="d">${dLabel(pts[i].d)}</span>`;
    show(tip, true);
    /* Positioned in CSS pixels off the box, not SVG units, and flipped near the
       right edge so it never hangs outside the modal. */
    const px = xs[i] * (r.width / w);
    const tw = tip.offsetWidth;
    tip.style.transform = `translate(${Math.min(Math.max(px - tw / 2, 0), r.width - tw)}px, ${
      Math.max(0, ys[i] * (r.height / h) - tip.offsetHeight - 10)}px)`;
  };
  const leave = () => { show(live, false); show(tip, false); };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", leave);
  svg.addEventListener("pointercancel", leave);
}

function priceSheet(id) {
  const b = S.buckets.find(x => x.id === id);
  const v = b && priceView(b);
  if (!v) { toast("No prices for this one yet"); return; }
  const tone = priceTone(v);
  const claim = v.best ? `${v.best.label} ${v.best.dir}` : "mid-range";

  /* The feed's own name for the instrument, first line, before anything else.
     A mistyped ticker fetches somebody else's prices perfectly happily and every
     number below would look completely plausible; the only defence is reading
     back what the feed thinks you asked for. */
  openModal(`
    <h2>${esc(b.name)}</h2>
    <div class="pshead">
      <span class="psprice">${pnum(v.price, v.ccy)}</span>
      <span class="pricerow tone-${tone}" style="width:auto;margin:0;padding:4px 10px;cursor:default">
        <span class="pclaim">${claim}</span></span>
    </div>
    <p class="pssub">${esc(v.name)} · ${esc(v.key)} · close of ${dLabel(v.day)}${
      v.stale ? ` · <b>${v.ageDays} days old</b>` : ""}</p>

    <div class="psrow">
      <div class="seg" id="ps-seg" role="group" aria-label="Window">
        ${v.spans.map(s => `<button type="button" data-span="${s.key}"
          aria-pressed="${s.key === v.ctx.key}">${s.key}</button>`).join("")}
      </div>
    </div>

    ${/* One tone for the whole sheet, not one per selected window: the badge above
          and the line below have to be the same colour or they read as two
          different verdicts on one price. Which window caused it is in the table,
          where the marked cell says so precisely. */""}
    <div class="chartbox tone-${tone}" id="ps-chart"></div>

    <table class="grid pspans">
      <thead><tr><th>Window</th><th>Low</th><th>High</th><th>Position</th></tr></thead>
      ${/* data-label on every cell but the first: under 640px the stylesheet drops
            the thead and prints these instead, so a stacked row still says which
            number is the low and which the high. */""}
      <tbody>${v.spans.map(s => `<tr>
        <td>${s.label}</td>
        <td data-label="Low"  class="${s.dir === "low" ? "mark" : ""}">${pnum(s.lo, v.ccy)}</td>
        <td data-label="High" class="${s.dir === "high" ? "mark" : ""}">${pnum(s.hi, v.ccy)}</td>
        <td data-label="Position">${Math.round(s.pos * 100)}%${s.wide ? "" : " · flat"}</td>
      </tr>`).join("")}</tbody>
    </table>
    <p class="hint" style="margin-top:9px">Position is where today sits between that window's
      low and high. A window whose whole range is under 2% is marked flat — being at the
      "bottom" of a range that never moved is not a low.</p>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Close</button>
      <button class="btn primary" onclick="closeModal(); buyForm('${b.id}')">Record a buy</button>
    </div>
  `, m => {
    const host = m.querySelector("#ps-chart");
    draw(v.ctx.key);
    function draw(key) {
      m.querySelectorAll("#ps-seg [data-span]").forEach(el =>
        el.setAttribute("aria-pressed", String(el.dataset.span === key)));
      drawSheetChart(host, v, key);
    }
    m.querySelectorAll("#ps-seg [data-span]").forEach(btn => btn.onclick = () => draw(btn.dataset.span));
  });
}

/* ============================================================
   6. Dashboard
   ============================================================ */

function renderHero() {
  const rows = S.buckets.map(b => ({ b, L: ledgerOf(b) }));
  /* "due" counts too: a bucket with this month's money still sitting in it is
     something to do, which is the whole point of the plan. Only fully-deployed
     and not-yet-started buckets are off this list. */
  const urgent = rows.filter(r => ["cap", "act", "due"].includes(statusOf(r.L).key)).length;

  /* One column per currency actually in play, in a fixed order so the hero does
     not reshuffle when a bucket is added, and skipped entirely when nothing is
     held in it — a plan with no dollar bucket looks exactly as it did before.
     Never a single sum: a rupee lot and a dollar lot are different money, this
     app holds no exchange rate to bridge them with (each buy carries only the
     rate of its own day, and there is no price fetching here by design), so
     adding them would invent a number. Showing one and hiding the other would
     be worse — half the plan, silently missing. So they are set side by side,
     separated by a mark that makes no arithmetic claim. */
  const held = ["INR", "USD"].filter(c => rows.some(r => r.L.ccy === c));
  const live = held.length ? held : ["INR"];   // an empty plan still shows a ₹0
  const sum = (c, k) => rows.filter(r => r.L.ccy === c).reduce((t, r) => t + r.L[k], 0);
  const pair = (k, cls) => live.map(c => {
    const v = sum(c, k);
    return `<div class="${cls}${cls === "v" && k === "lapsedTotal" && v > 0 ? " v-danger" : ""}"
      >${moneyBig(v, c)}</div>`;
  }).join(`<span class="fig-sep" data-for="${cls}" aria-hidden="true">·</span>`);

  document.getElementById("hero").innerHTML = `
    <div>
      <div class="label">Waiting to be invested</div>
      <div class="moneypair">${pair("pending", "figure")}</div>
    </div>
    <div class="side">
      <div><div class="label">Budget / month</div>
        <div class="moneypair">${pair("monthly", "v")}</div></div>
      <div><div class="label">Needs action</div>
        <div class="v">${urgent} of ${S.buckets.length} bucket${S.buckets.length === 1 ? "" : "s"}</div></div>
      <div><div class="label">Lapsed so far</div>
        <div class="moneypair">${pair("lapsedTotal", "v")}</div></div>
    </div>`;
}

function renderDash() {
  const host = document.getElementById("view-dash");
  if (!S.buckets.length) {
    host.innerHTML = `<div class="panel glass empty">
      <h2>No buckets yet</h2>
      <p>A bucket is one thing you fund every month — a fund, an ETF, or a stock.
         Nothing is pre-filled; build the plan the way you actually run it.</p>
      <button class="btn primary" onclick="editBucket()">Add your first bucket</button>
    </div>`;
    return;
  }

  const rows = S.buckets.map(b => ({ b, L: ledgerOf(b) }));
  rows.sort((x, y) => {
    const d = RANK[statusOf(x.L).key] - RANK[statusOf(y.L).key];
    return d || (y.L.pending - x.L.pending);
  });

  const card = ({ b, L }) => {
    const st = statusOf(L);
    const pct = L.capAmount ? Math.min(100, L.pending / L.capAmount * 100) : 0;

    /* Four lines of prose came off this card: the fund's full name under the
       amount, the "oldest budget from July · waiting 3 months" trail, and the
       Last bought / Reviewed pair. None of them were wrong — they were just
       being read every time the dashboard opened to answer a question that is
       asked once a quarter. What stays is what a glance is actually for: which
       bucket, how much a month, how much is owed, how close to lapsing, and the
       badge that already says "3 months behind" in words. The age is still on
       the meter (the fill is pending against the cap) and the exact months are
       one tap away on the buy sheet, which lists them individually. */
    return `<article class="card glass">
      <div class="card-head">
        <div>
          <div class="nm">${esc(b.name)}</div>
          <div class="sub">${money(L.monthly, L.ccy)}/month</div>
        </div>
        <span class="status st-${st.key}" style="--st:var(${st.st})"><span class="ic">${st.ic}</span>${st.label}</span>
      </div>

      <div class="pending-row">
        <span class="amt">${moneyBig(L.pending, L.ccy)}</span>
        <span class="since">pending</span>
      </div>

      <div class="meter" style="--st:var(${st.st})">
        <div class="track"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div>
        <div class="ticks"><span>${money(0, L.ccy)}</span><span>${L.cap}-month cap · ${money(L.capAmount, L.ccy)}</span></div>
      </div>

      ${/* Both rows are exceptions — money that expired unbought, or bought
            ahead of schedule — so the block only exists when there is one. An
            empty .kv would still take its 12px of the card's gap. */
        L.lapsedTotal > 0 || L.advance > 0 ? `<div class="kv">
        ${L.lapsedTotal > 0 ? `<div><span>Lapsed</span> <b style="color:var(--danger-text)">${money(L.lapsedTotal, L.ccy)}</b></div>` : ""}
        ${L.advance > 0 ? `<div><span>Bought ahead</span> <b>${money(L.advance, L.ccy)}</b></div>` : ""}
      </div>` : ""}

      ${priceRow(b)}

      <div class="card-actions">
        <button class="btn sm primary" onclick="buyForm('${b.id}')">Record buy</button>
        <button class="btn sm iconbtn" onclick="editBucket('${b.id}')"
                aria-label="Edit ${esc(b.name)}" title="Edit">${ICON_PENCIL}</button>
      </div>
    </article>`;
  };

  /* Grouped by category, always in KIND_ORDER — funds, then Indian stocks, then
     US stocks — rather than by whatever is most urgent, because the order of the
     sections is the one thing on this screen that should never move. Inside a
     section the existing sort still applies, so the bucket that needs attention
     is the first card under its own heading. Empty sections are omitted: an
     "Indian Stocks (0)" header is a header about nothing.

     <details> rather than a click handler on a div: the disclosure triangle, the
     keyboard behaviour, Enter and Space, and find-in-page opening a closed
     section all come free and none of it is code here. */
  host.innerHTML = KIND_ORDER.map(k => {
    const inK = rows.filter(r => kindOf(r.b) === k);
    if (!inK.length) return "";
    /* Collapsed, a section still has to be worth reading, so the summary carries
       what the cards under it would have said: how many, and how much is waiting.
       Per currency and never summed — same reason as the hero. */
    const held = ["INR", "USD"].filter(c => inK.some(r => r.L.ccy === c));
    const tot = held.map(c =>
      money(inK.filter(r => r.L.ccy === c).reduce((t, r) => t + r.L.pending, 0), c)).join(" · ");
    return `<details class="group" data-gk="${k}" ${groupOpen(k) ? "open" : ""}>
      <summary>
        <span class="gnm">${KINDS[k]}</span>
        <span class="gct">${inK.length}</span>
        <span class="gtot">${tot} pending</span>
      </summary>
      <div class="cards">${inK.map(card).join("")}</div>
    </details>`;
  }).join("");

  /* Every edit re-renders this whole section, so a section you collapsed would
     spring open the moment you recorded a buy. The open set therefore has to
     outlive the markup — and it is per-device view state, not part of the plan,
     so it lives in its own localStorage key rather than in S, where sync would
     carry your phone's collapsed sections to your laptop. */
  host.querySelectorAll("details.group").forEach(d => d.addEventListener("toggle", () => {
    const closed = new Set(lsGet(DASH_GROUPS, []) || []);
    if (d.open) closed.delete(d.dataset.gk); else closed.add(d.dataset.gk);
    try { localStorage.setItem(DASH_GROUPS, JSON.stringify([...closed])); } catch (e) {}
  }));
}

/* Stored as the CLOSED set, so a category added later — or a fresh device —
   defaults to open rather than to invisible. */
const DASH_GROUPS = "deployment-tracker-groups";
const groupOpen = k => !(lsGet(DASH_GROUPS, []) || []).includes(k);

function wipe() {
  if (!confirm("Delete the entire plan, all purchases and all logs from this browser?\n\nThis cannot be undone. Save to file first if you want a copy.")) return;

function delBucket(id) {
  const b = S.buckets.find(x => x.id === id);
  const n = S.purchases.filter(p => p.bucketId === id).length;
  if (!confirm(`Delete "${b.name}"` + (n ? ` and its ${n} recorded purchase${n > 1 ? "s" : ""}` : "") + "?")) return;
  S.buckets = S.buckets.filter(x => x.id !== id);
  S.purchases = S.purchases.filter(p => p.bucketId !== id);
  S.skips = S.skips.filter(k => k.bucketId !== id);
  markDirty(); renderAll();
}
