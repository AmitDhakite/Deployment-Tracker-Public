<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONEY Follows Mah Brotha</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a855f7'/%3E%3Cstop offset='1' stop-color='%23e24bb4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M7 21l5-6 4 3 5-8' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  /* ============================================================
     Tokens — "liquid glass" on a violet→magenta→pink ramp, built to stay cheap.

     Performance rules this sheet follows, because the first pass was
     laggy for exactly these reasons:
       · NO backdrop-filter, anywhere, at any size. Not on repeated elements
         (cards, panels, buttons) and not on the modal .backdrop either — a
         viewport-sized blur is re-run by the compositor whenever the modal
         above it repaints, which measured 94ms/frame while typing against
         3.4ms with it off.
       · ALPHA MUST EARN ITSELF. It forbids occlusion culling, so the .aura
         wash gets re-blended under every translucent surface. The rule used to
         be "opaque, never 0.9x alpha" and it was right about the specific thing
         it was aimed at: alpha you cannot SEE is pure cost. The grid is
         translucent now because you can see it — the wash was extended down the
         viewport so a card genuinely shows something through itself, and that is
         judged worth its cost (measured below). What is still banned outright is
         alpha on anything that moves or on a sticky bar.
       · NO animated blur. The ambient wash is a static gradient painted
         once, not three animated blur(70px) blobs forcing every glass
         surface to recompute its blur every frame.
       · NO filters on live DOM — not SVG ones and not even a cheap
         brightness(). Any filter gives the element its own render surface for
         as long as it applies, so the primary button's hover lift is a
         brighter gradient, not a brightness() pass. Every card carries one of
         those buttons, so this is not a corner case: it is the hot path.
         A filter inside a background-image data URI is a DIFFERENT
         THING and is allowed: that SVG is an immutable image resource, so
         feGaussianBlur runs once at decode and the result is cached as a
         texture. That is how .aura gets a genuinely soft ribbon without
         paying for a blur per frame. This used to say "zero RasterTasks across
         a full-page scroll" and that is no longer true — it was measured when
         the grid was opaque. Re-measured 2026-08-30 with the grid translucent:
         a full-page scroll rasters 250 tiles / ~460ms against 51 / ~102ms with
         the surfaces opaque, and typing 12 chars 169 / ~298ms against 98 /
         ~100ms. Both figures reproduced exactly with the two orders reversed,
         so it is not a warm-up artifact. The ribbon is NOT what costs: only the
         alpha on the surfaces varied between the runs, so that 5x is the price
         of the translucency itself. There used to be a Lite toggle that bought
         it back; it is gone, so this is the standing cost of the look, and it
         is the first place to look if a phone ever feels heavy.
       · STATIC IS FREE. An elaborate background costs nothing once painted,
         while a cheap thing that moves costs every frame. Spend on texture,
         never on motion. This was first written for a streamed desktop, where
         the bill is literally changed pixels; the target is now a personal
         machine and a phone, and it holds there for a different reason — a
         phone pays for repaints in battery.
       · Translucency is GRADED, not rationed away. The hero and the modal are
         the thinnest (--frost-*, they never scroll); the grid is denser
         (--card-*, ~.8 alpha, enough to tint but not enough to lose 12px muted
         text); the sticky header stays fully opaque, because you would
         otherwise be reading card text through it.
       · NO transitioned box-shadow. Animating a wide blur repaints the
         element and its backdrop every frame; hover animates transform
         (compositor-only) and swaps the deeper shadow in one paint.
       · Text contrast is measured on the COMPOSITED surface, not on the token.
         Once a card is translucent, --surface-solid is no longer what you are
         reading text on, so every ratio quoted below was taken by screenshotting
         the bare surface over the wash and sampling the pixels.

     Colours are validated, not decorative: the link blue is measured on
     --surface-solid in both themes, and it is the one hue that is neither chrome
     nor status, precisely so it can never be mistaken for a status step or for a
     button. White-on-magenta chrome is built on --accent-deep rather than
     --accent so the label clears AA at the gradient's lightest stop, which is
     :hover — lighter than anything in the resting state, and the point a
     mid-tone average would hide.

     Status colours are FILLS and are held apart from chrome on purpose: the
     ladder is amber → vermilion → red, none of which appear in the chrome ramp
     now that chrome is violet→pink, so a badge can never read as decoration.
     An icon disc's glyph is measured against the disc, which is why amber is
     the one disc that takes dark ink instead of white — at luminance 0.52 no
     white glyph clears AA on it without darkening it out of being amber.
     ============================================================ */
  :root {
    color-scheme: light;
    --page:          #fbf5fd;
    --page-2:        #f5e7fb;
    /* the opaque reference surface every ratio below is quoted against */
    --surface-solid: #fefcff;
    /* Opaque, not 0.97/0.92 alpha. These are the colours that alpha already
       blended to over the wash, so nothing looks different — but any alpha at
       all rules out every optimisation that needs a surface to be opaque,
       including skipping the .aura underneath. Free to give up. */
    --surface-1:     #fefcff;
    --surface-1b:    #fbf6fe;
    --inset:         rgba(58,14,72,0.05);

    --text-primary:  #140818;
    --text-secondary:#4c3f55;
    --text-muted:    #6a5f72;   /* 4.6:1 — small text needs it */
    --gridline:      #eae0f1;
    --baseline:      #cec0d8;
    --border:        rgba(58,14,72,0.10);

    /* Link blue. It has to be the one hue that is neither chrome nor status:
       amber through red are the four status steps, so the whole warm half is
       spoken for, and magenta and violet are chrome. Blue is what is left, and
       it is far enough from the magenta ramp that a link never reads as a
       button. It used to also draw the price chart — the charts are gone, but
       the reasoning for the hue is unchanged. Measured, not assumed. */
    --series-1:      #3a5ecc;   /* 5.6:1 on --surface-solid (measured) */
    /* Two magentas, because one cannot do both jobs. --accent is the bright
       one: rims, focus rings, hover tints, the ribbon's ambient blooms, all
       places nothing has to be read on top of it. --accent-deep is the fill
       under WHITE TEXT — the primary button and the selected tab. The bright
       magenta carries white 13px text at about 3.2:1, under AA, so the fill is
       the deep one and the bright one is kept for the top sheen and the outer
       glow, where it costs nothing to read.

       The button gradient's LIGHTEST stop is the number that matters, and it is
       not --accent-deep itself: :hover opens to color-mix(--accent-deep 62%,
       --accent), lighter than anything in the resting state. White measures
       5.23:1 there, 5.62 on the resting top stop, 6.64 on the solid. */
    --accent:        #e24bb4;   /* bright purplish pink */
    --accent-deep:   #a3208f;   /* the fill under white text */
    --accent-2:      #a855f7;   /* violet — chrome gradients and glow only */
    --st-good:       #0ca30c;
    --st-warning:    #fab219;
    --st-serious:    #e2622f;   /* deepened from #ec835a: the ladder now reads
                                   amber -> vermilion -> red as a clear
                                   escalation, and sits away from the chrome */
    --st-critical:   #d03b3b;
    /* The "not started yet" / "no budget" state. This used to pass --text-muted
       in as --st, but --st is a FILL and --text-muted is a text colour that
       INVERTS between themes — so in dark mode the icon disc became a pale grey
       plate under a white glyph and measured 1.75:1. A fill has to be a fill:
       one warm neutral, same in both themes, dark enough to carry white. */
    --st-idle:       #6b5f60;
    /* --st-critical is a FILL: it tints the status pill and fills the icon disc
       under a white glyph, so it has to stay dark. As TEXT on a surface it only
       measured 3.68:1 in dark mode, so lapsed amounts and the delete affordance
       use this darker sibling instead. A fill and an ink are not one token. */
    --danger-text:   #c2202b;   /* 5.5:1 on --surface-solid */
    /* Same story one rung down the ladder: --st-serious as ink measured 3.42:1
       here, because a mid-luminance orange has nowhere to go on a near-white
       surface. The sync badge's "not pushed" state uses this. */
    --warn-text:     #b44a0c;   /* 5.24:1 on --surface-solid */
    /* Price direction, and the one green ink in the file. --st-good is a FILL
       (#0ca30c measures 3.27:1 as text here), so the same split that gave
       --danger-text its own token applies: a fill and an ink are not one token.

       Emerald rather than grass green, and that is measured, not taste. Paired
       against --danger-text the obvious #0b7a2c separates by only ΔE 4.2 under
       deuteranopia — a red card and a green card would be the same card for
       roughly one man in twelve. Rotating the hue toward the blue end of green
       until the pair cleared ΔE 8 landed here (8.5 deutan, 6.06:1 as text). It
       still reads unmistakably green; it just is not the greenest green. */
    --ok-text:       #0a7044;   /* 6.06:1 on --surface-solid */
    --ghost:         rgba(58,14,72,0.045);

    /* Glass rim. Two lit corners with a dark middle, not an even outline —
       that asymmetry is what makes a rounded rectangle read as a lens catching
       light from one side instead of a card with a border. */
    --rim: linear-gradient(148deg,
             rgba(255,255,255,0.98) 0%,
             rgba(255,255,255,0.42) 26%,
             rgba(58,14,72,0.08)   52%,
             rgba(58,14,72,0.12)   78%,
             rgba(255,255,255,0.55) 100%);
    /* the water-drop specular, folded into the surface fill so it costs
       no extra layer */
    --sheen: radial-gradient(120% 78% at 20% -20%,
               rgba(255,255,255,0.95), rgba(255,255,255,0) 60%);
    --lip:     rgba(255,255,255,0.85);
    --lip-low: rgba(58,14,72,0.05);

    --sh-sm: 0 1px 2px rgba(64,16,78,0.06);
    --sh-md: 0 1px 2px rgba(64,16,78,0.06), 0 10px 24px -10px rgba(64,16,78,0.20);
    --sh-lg: 0 1px 2px rgba(64,16,78,0.07), 0 22px 48px -16px rgba(64,16,78,0.30);
    --glow: 0.32;

    /* Glass over light needs a paler, higher-alpha frost or the text loses its
       footing; over dark it can be far more transparent. */
    --frost-a: rgba(255,255,255,0.66);
    --frost-b: rgba(255,255,255,0.52);
    --refract-1: rgba(255,105,205,0.16);
    --refract-2: rgba(185,120,255,0.15);
    /* The scrolling grid's own frost — the same idea as --frost-* but denser,
       because a card carries 12px muted text over whatever the wash happens to
       be doing beneath it while the hero carries a 52px figure. High enough to
       read as "a little translucent" rather than as a hole in the page. */
    --card-a: rgba(254,252,255,0.80);
    --card-b: rgba(249,243,253,0.71);
    --refract-card: rgba(240,130,225,0.11);
    /* the lit far edge, the cue that says a pane has THICKNESS — .lens has a
       stronger version of the same shadow, this is the grid's share of it */
    --inner-edge: rgba(255,255,255,0.55);
    --dim: rgba(38,10,52,0.54);
    /* raised from 0.34 once the grid went translucent: at a third opacity the
       light wash had almost nothing left to show THROUGH a card */
    --ribbon-op: 0.52;

    --radius: 20px;
    --radius-lg: 26px;
    --radius-sm: 12px;

    /* ------------------------------------------------------------------
       The ribbon. One SVG, used as a background-image, so its feGaussianBlur
       is resolved once when the image is decoded and then lives as a cached
       texture — a soft curved band of light for the price of a static bitmap,
       which is the only way to have this look and still be smooth over a
       streamed desktop. Four strokes on two paths: a wide bloom, a tighter
       core, a pale specular edge riding just above the core (that offset is
       what makes it look like a lit surface rather than a coloured smear),
       and two dim blooms in the side margins for balance.

       Gradient #r runs deep violet -> purple -> orchid -> hot pink -> pale
       pink along the band, and the margin blooms take their own gradient #m,
       pink at the top falling to deep violet. Every hue in here is chrome; none
       of it is a status step, which is the whole reason the status ladder can
       stay amber -> vermilion -> red without competing.

       WHERE it goes was the original design constraint, and it has since
       relaxed: the cards used to be opaque, so anywhere the band passed behind
       the grid it was sliced off at a card's straight edge and looked like a
       mistake. That is why the bright section crosses the top strip only,
       behind the hero, and exits off the top-right corner with its palest end
       already out of frame so nothing on screen blows out. The grid is
       translucent now and the extra blooms on .aura are there precisely so a
       card has something to transmit — but the band itself still keeps to the
       top strip and the margins, because a hard diagonal crossing a column of
       cards reads as a seam no matter how much alpha they have.
       ------------------------------------------------------------------ */
    --ribbon: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 1000'><defs><linearGradient id='r' x1='0' y1='1' x2='1' y2='0'><stop offset='0' stop-color='%23360a5c'/><stop offset='.26' stop-color='%236a12b0'/><stop offset='.50' stop-color='%23b02fd8'/><stop offset='.72' stop-color='%23ff4fbe'/><stop offset='.89' stop-color='%23ff9ad8'/><stop offset='1' stop-color='%23ffe2f6'/></linearGradient><linearGradient id='m' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23ff5fd0'/><stop offset='.55' stop-color='%23a020c8'/><stop offset='1' stop-color='%23470f6d'/></linearGradient><filter id='w' x='-35%25' y='-35%25' width='170%25' height='170%25'><feGaussianBlur stdDeviation='62'/></filter><filter id='n' x='-25%25' y='-25%25' width='150%25' height='150%25'><feGaussianBlur stdDeviation='15'/></filter></defs><g fill='none' stroke-linecap='round'><path stroke='url(%23r)' d='M-240 300 C 180 240 400 120 700 50 C 1000 -20 1320 -30 1800 -170' stroke-width='200' opacity='.46' filter='url(%23w)'/><path stroke='url(%23r)' d='M-240 300 C 180 240 400 120 700 50 C 1000 -20 1320 -30 1800 -170' stroke-width='56' opacity='.82' filter='url(%23n)'/><path stroke='url(%23m)' d='M-120 260 C -40 520 60 720 -20 1080' stroke-width='260' opacity='.30' filter='url(%23w)'/><path stroke='url(%23m)' d='M1660 420 C 1560 620 1620 840 1560 1120' stroke-width='260' opacity='.26' filter='url(%23w)'/></g><path d='M-240 274 C 180 214 400 94 700 24 C 1000 -46 1320 -56 1800 -196' fill='none' stroke='%23fdeaff' stroke-width='5' opacity='.6' filter='url(%23n)'/></svg>");
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    /* near-black, because a luminous ribbon needs somewhere dark to be
       luminous against — #0b0713 was already washing the colour out */
    --page:          #08050d;
    --page-2:        #170a1e;
    --surface-solid: #1f1424;
    /* Opaque, but lifted and pushed violet now that the page behind them is
       near-black: on #08050d a neutral grey read as dead. These are the
       colours a thin frost would blend to over the ribbon's dim end, so the
       cards look like the same material as the hero even where they are opaque. */
    --surface-1:     #271a2e;
    --surface-1b:    #1a0f20;
    --inset:         rgba(0,0,0,0.34);

    --text-primary:  #ffffff;
    --text-secondary:#d6ccdc;
    /* lifted TWICE: once for small-text contrast on a solid surface, and again
       on 2026-08-30 when the grid went translucent. 12px muted text over a
       card is now read against the card COMPOSITED over the wash, which is
       lighter than --surface-solid wherever the wash is bright — it measured
       3.37:1 at #b1a2a4 and 4.7:1 here, worst card in the grid. */
    --text-muted:    #c3b8c9;
    --gridline:      #332639;
    --baseline:      #4d3c56;
    --border:        rgba(255,255,255,0.11);

    --series-1:      #7aa2ff;   /* 7.1:1 on --surface-solid (measured) */
    --accent:        #ff5cd0;   /* hot pink — glow and rims only */
    --accent-deep:   #9c1f86;   /* white text at the lightest stop of the
                                   gradient built on it — measured below */
    --accent-2:      #b477ff;
    --danger-text:   #ff5f5f;   /* 5.8:1 on --surface-solid */
    /* Lightened rather than darkened, the opposite direction to the light theme —
       measured 5.93:1 against the LIGHTEST stop of the button's own gradient
       (39,26,46), not against --surface-solid, which flatters it to 6.38. */
    --warn-text:     #f07a3a;   /* 5.93:1 worst case on a .btn face */
    /* Its own step, not a lightened copy of the light theme's: --danger-text is
       much lighter here (#ff5f5f), so the green had to move UP in lightness too
       to keep the pair apart under CVD. Measured 8.1 ΔE protan, 5.62:1 as text. */
    --ok-text:       #26a566;
    /* controls sunk INTO glass read as darker wells, not lighter ones — the
       inner pill in the reference is darker than the panel around it */
    --ghost:         rgba(8,3,12,0.32);

    /* brighter and two-cornered: on near-black the rim is most of what says
       "glass", since there is no dark side for a shadow to define */
    --rim: linear-gradient(148deg,
             rgba(255,255,255,0.58) 0%,
             rgba(255,255,255,0.16) 24%,
             rgba(255,255,255,0.03) 50%,
             rgba(255,255,255,0.04) 74%,
             rgba(250,214,255,0.42) 100%);
    --sheen: radial-gradient(120% 78% at 20% -20%,
               rgba(255,255,255,0.16), rgba(255,255,255,0) 58%);
    --lip:     rgba(255,255,255,0.17);
    --lip-low: rgba(0,0,0,0.40);

    --sh-sm: 0 1px 2px rgba(0,0,0,0.55);
    --sh-md: 0 1px 2px rgba(0,0,0,0.55), 0 12px 28px -12px rgba(0,0,0,0.85);
    --sh-lg: 0 1px 3px rgba(0,0,0,0.6), 0 24px 54px -18px rgba(0,0,0,0.95);
    --glow: 0.72;

    /* thin frost over dark: the ribbon should be legible THROUGH the panel,
       so this is far more transparent than the light-mode equivalent. Raised
       from .50/.66 on 2026-08-30 — the hero sits exactly where the ribbon is
       brightest, and measuring against the composited pixels (rather than
       against --surface-solid, which is what the old audit did and why this
       was missed) put the 11.5px "WAITING TO BE INVESTED" label at 3.6:1.
       It is 4.6:1 here and the panel is still visibly a thin pane. */
    --frost-a: rgba(66,34,80,0.64);
    --frost-b: rgba(26,11,32,0.76);
    --refract-1: rgba(255,80,200,0.22);
    --refract-2: rgba(180,110,255,0.24);
    --card-a: rgba(56,37,66,0.76);
    --card-b: rgba(29,18,36,0.83);
    --refract-card: rgba(240,130,230,0.15);
    --inner-edge: rgba(246,230,255,0.26);
    --dim: rgba(6,2,10,0.80);
    --ribbon-op: 1;
  }

  * { box-sizing: border-box; }
  /* A classic desktop scrollbar takes its width out of the viewport, so a page
     that fits with a category collapsed and overflows with it open loses and
     regains ~10px — and .wrap, being centred, slides sideways every time. The
     gutter is reserved whether or not the bar is there, which costs that width
     permanently and stops the jump. Overlay scrollbars (every phone, and macOS
     by default) reserve nothing here, which is where there was nothing to fix. */
  html { scrollbar-gutter: stable; }
  /* The UA's [hidden] rule is one class specific; several rules in this sheet set
     display on two or three classes, so they quietly outrank it — which is why the
     refresh button, hidden by the JS whenever sync is unconfigured, was still
     painted and still doing nothing when clicked. !important is the fix that keeps
     working when the next display rule is written. The three places that use the
     attribute all remove it to reveal, so nothing here has to beat it. */
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3 { margin: 0; font-weight: 600; }
  button { font: inherit; }
  a { color: var(--series-1); }
  ::selection { background: color-mix(in oklab, var(--accent) 25%, transparent); }

  /* ---------- the ribbon: one fixed layer, painted once, never moved ----------
     The SVG carries the shape and the softness; the radial gradients under it
     are the ambient bloom and double as the fallback if the data URI ever
     fails to parse — you would lose the band but still have a lit page rather
     than flat black. Nothing here animates, and because the layer is fixed it
     does not repaint on scroll: the encoder sees these pixels once.

     The middle three stops are new, and they exist because the grid went
     translucent. The SVG band lives in the top third of the viewport, which was
     fine while it only had to backdrop the hero; a card that is 16% transparent
     over flat paint is indistinguishable from an opaque one. So the wash now
     carries low-frequency colour all the way down the viewport, and since the
     layer is fixed, a card crossing it picks up a different tint as you scroll
     — which is the whole reason to make it translucent in the first place.
     Broad soft ellipses, not detail: a 0.84-alpha frost is a low-pass filter
     and anything finer than this would be thrown away by it. */
  .aura {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    opacity: var(--ribbon-op);
    /* deliberately NOT promoted with translateZ(0): Chrome already gives a
       fixed element its own layer once scrolling content overlaps it, and
       forcing a second one measured no better while costing GPU memory */
    background:
      var(--ribbon) center / cover no-repeat,
      radial-gradient(62vw 46vh at 14% 54%, color-mix(in oklab, var(--accent)   21%, transparent), transparent 72%),
      radial-gradient(54vw 42vh at 92% 70%, color-mix(in oklab, var(--accent-2) 19%, transparent), transparent 70%),
      radial-gradient(70vw 40vh at 52% 108%, color-mix(in oklab, var(--accent) 16%, transparent), transparent 74%),
      radial-gradient(50vw 44vw at 4% 96%,  color-mix(in oklab, var(--accent)   18%, transparent), transparent 66%),
      radial-gradient(46vw 40vw at 96% 2%,  color-mix(in oklab, var(--accent-2) 20%, transparent), transparent 66%),
      radial-gradient(120% 80% at 50% -10%, var(--page-2), var(--page) 58%);
  }

  .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 14px 20px 90px; }

  /* ============================================================
     The glass recipe — sheen + one refraction bloom + frost in a single
     background, rim on the border box, lip as an inset shadow. Still one
     paint and still no filters.

     TRANSLUCENT as of 2026-08-30, on the user's call, and they were right:
     a rim and a sheen alone cannot make a card read as glass, because glass
     is defined by what you can see THROUGH it. The alpha is deliberately
     high — .84/.76 over light, .76/.84 over dark — so a card is "a little
     translucent": the wash's colour pools where the sheen falls off, and each
     card in the grid takes a slightly different tint from whatever it happens
     to be sitting over. Text contrast was re-measured against the COMPOSITED
     surface (screenshot the bare card, sample the pixels) rather than against
     the token, because the token is no longer what you are reading on.

     What it costs, stated plainly: alpha forbids occlusion culling, so the
     wash under a card is painted instead of skipped. That is affordable here
     only because the wash is one FIXED layer that never moves or animates —
     the pixels are already rasterised, so this is fill-rate on an existing
     texture, not new raster work. Measured in the header comment above, and
     paid unconditionally now: there is no opaque skin to fall back to.
     ============================================================ */
  .glass {
    position: relative;
    border: 1px solid transparent;
    border-radius: var(--radius);
    background:
      var(--sheen) padding-box,
      radial-gradient(130% 160% at 88% -25%, var(--refract-card), transparent 62%) padding-box,
      linear-gradient(163deg, var(--card-a), var(--card-b)) padding-box,
      var(--rim) border-box;
    box-shadow:
      inset 0 1px 0 var(--lip),
      inset 0 -1px 0 var(--lip-low),
      /* light entering the top-left corner surfacing again just inside the far
         edge — the same trick .lens uses, at about a third of the strength.
         This is the difference between a tinted panel and a pane of glass, and
         it is a fourth shadow in a shadow list that was already being painted. */
      inset 0 0 30px -13px var(--inner-edge),
      var(--sh-md);
  }
  /* The one surface that stays OPAQUE, and not for performance reasons: the
     header is sticky, so anything transparent about it means the card text
     scrolling underneath is legible straight through the header's own text.
     Apple gets away with a translucent bar because it blurs what is behind it;
     we have no blur to spend, so this bar is solid. */
  header.top {
    background:
      var(--sheen) padding-box,
      linear-gradient(163deg, var(--surface-1), var(--surface-1b)) padding-box,
      var(--rim) border-box;
  }

  /* ============================================================
     .lens — the real thing, for the two surfaces that never scroll.
     A thin frost you can see the ribbon through, plus two colour blooms
     that continue the ribbon's path across the panel at lower contrast.
     That second part is the refraction: light bending through the pane
     rather than stopping at it, and it is baked into the same background
     shorthand, so it is still one paint and still no filter.
     ============================================================ */
  .lens {
    border-radius: var(--radius-lg);
    background:
      var(--sheen) padding-box,
      radial-gradient(95% 150% at 90% -25%, var(--refract-2), transparent 60%) padding-box,
      radial-gradient(80% 130% at 4% 125%, var(--refract-1), transparent 58%) padding-box,
      linear-gradient(148deg, var(--frost-a), var(--frost-b)) padding-box,
      var(--rim) border-box;
    box-shadow:
      inset 0 1px 0 var(--lip),
      inset 0 -1px 0 var(--lip-low),
      /* the lit inner edge — a lens has thickness, so the light that enters
         the top-left corner shows up again just inside the far edge */
      inset 0 0 34px -14px rgba(255,255,255,.30),
      var(--sh-lg);
  }

  /* ---------- header island ---------- */
  header.top {
    position: sticky; top: 10px; z-index: 25;
    /* nowrap: the actions are three icons and a dropdown now, so there is no
       width at which this bar needs a second row — and a sticky header that
       grows one on a narrow window shifts everything under it. */
    display: flex; align-items: center; gap: 14px; flex-wrap: nowrap;
    margin-bottom: 16px; padding: 12px 16px;
  }
  /* min-width: 0 + ellipsis — a flex item will not shrink below its text's
     min-content otherwise, and the title is the one part of this bar that can
     afford to be cut off at 320px. */
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .brand h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brand .mark {
    width: 32px; height: 32px; border-radius: 10px; flex: none; position: relative;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45),
                0 4px 14px -4px color-mix(in oklab, var(--accent) 70%, transparent);
  }
  .brand .mark::after {
    content: ""; position: absolute; inset: 5px 5px auto 5px; height: 9px;
    border-radius: 6px 6px 10px 10px;
    background: linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,0));
  }
  .brand h1 { font-size: 16px; letter-spacing: -0.015em; }
  /* position: relative — the dropdown hangs off this, not off the header, so it
     lines up with the menu button's right edge rather than the bar's */
  .top-actions { margin-left: auto; display: flex; gap: 7px; align-items: center; position: relative; }
  /* ---------- the actions menu, at every width ----------
     Save to file, Load file and the two skin switches were in the bar all the
     time on a desktop. Two of them are a once-a-month backup and the other two
     are settings you set once, so they were spending permanent space on rare
     work — and the header had to grow a second layout to hold them on a phone.
     One dropdown at every width removes both problems: the bar keeps only what
     is used per session (add, refresh), and there is a single set of buttons
     whose labels the JS rewrites (Sync ↑, Light, Full glass) rather than two. */
  .actions {
    position: absolute; top: calc(100% + 9px); right: 0; z-index: 30;
    display: none; flex-direction: column; align-items: stretch; flex-wrap: nowrap;
    min-width: 178px; padding: 7px; gap: 5px;
    border: 1px solid transparent; border-radius: 14px;
    /* OPAQUE, for the same reason the header is (see the note above header.top):
       this floats over cards that scroll underneath it, and translucency here
       means reading the menu's labels through the ledger's numbers */
    background:
      var(--sheen) padding-box,
      linear-gradient(163deg, var(--surface-1), var(--surface-1b)) padding-box,
      var(--rim) border-box;
    box-shadow: inset 0 1px 0 var(--lip), var(--sh-lg);
  }
  .actions.open { display: flex; }
  /* .btn.sm, not .btn: .btn.sm sets 5px/12.5px, matches on two classes and is
     declared further down this sheet, so a two-class selector here loses to it and
     the rows came out 31px instead of the 40 they are meant to be. This block used
     to sit in a media query below that rule, where source order settled it. */
  .actions .btn.sm {
    width: 100%; text-align: left; border-radius: 10px;
    padding: 10px 12px; font-size: 13.5px;   /* ~40px tall: a thumb target */
  }
  /* no lifts inside a menu — the row under the finger would slide out from it */
  .actions .btn.sm:hover, .actions .btn.sm:active { transform: none; }

  /* Square, so it reads as an icon rather than a very short label, and all three
     the same size so the bar reads as a set. The glyph is ↻ for the same reason
     the menu draws its dots in CSS: it is one character, it needs no SVG, and
     unlike ⋮ the phone fonts agree about it. */
  /* All three classes, not just .iconbtn: .btn.sm sets 12.5px, matches on two
     classes, and is declared further down the sheet — so it won the size back and
     left the glyph small enough to read as a typo rather than an icon. Specificity
     settles it here rather than relying on where in the file this sits. */
  .btn.sm.iconbtn {
    width: 34px; height: 28px; padding: 0; font-size: 16px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  /* Drawn, not typed. As the character "+" it sat visibly low in the button: flex
     centring centres the line box, and the plus's ink is centred on the font's
     math axis — above the middle of that box — so where the ink lands depends on
     metrics this file does not control. Two bars crossing at 50%/50% are centred
     by geometry instead, on every font and at every zoom. Same reasoning as the
     menu's dots. The vertical arm is the horizontal one rotated about its own
     centre, so the two cannot drift apart. */
  #btn-add .ic-plus { position: relative; width: 13px; height: 13px; }
  #btn-add .ic-plus::before, #btn-add .ic-plus::after {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: 2px; margin-top: -1px; border-radius: 2px; background: currentColor;
  }
  #btn-add .ic-plus::after { transform: rotate(90deg); }
  /* The spin lives on the inner span, not the button: .btn already owns transform
     for its hover lift, and an animation on the same property would fight it.
     Transform-only and only while a request is in flight — the two conditions
     this file holds every animation to. */
  .iconbtn.spin { pointer-events: none; opacity: 0.6; }
  .iconbtn.spin .ic-refresh { animation: icspin 0.8s linear infinite; }
  @keyframes icspin { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) {
    .iconbtn.spin .ic-refresh { animation: none; }
  }

  /* Dots are drawn with a box-shadow pair off one 3.5px node — no glyph, because
     ⋮ is one of the characters phone fonts disagree about most, and no SVG for
     three dots. */
  .kebab {
    display: inline-flex; align-items: center; justify-content: center;
    position: relative; width: 34px; height: 28px; padding: 0;
  }
  .kebab > span {
    width: 3.5px; height: 3.5px; border-radius: 50%; background: currentColor;
    box-shadow: 0 -6px 0 currentColor, 0 6px 0 currentColor;
  }
  /* Sync state has to survive being folded away: the amber "unpushed work" signal
     was the whole point of the badge, and inside a closed menu nobody sees it.
     So the menu button carries the same two states as a corner pip — which now
     matters at every width, not just on a phone. */
  .kebab.s-warn::after, .kebab.s-pend::after {
    content: ""; position: absolute; top: -2px; right: -2px;
    width: 8px; height: 8px; border-radius: 50%;
    border: 1.5px solid var(--surface-1);
  }
  .kebab.s-warn::after { background: var(--st-critical); }
  .kebab.s-pend::after { background: var(--st-warning); }

  /* ---------- buttons ---------- */
  .btn {
    color: var(--text-primary);
    border: 1px solid transparent; border-radius: 12px;
    padding: 7px 12px; cursor: pointer; white-space: nowrap;
    background:
      linear-gradient(var(--surface-1), var(--surface-1b)) padding-box,
      var(--rim) border-box;
    box-shadow: inset 0 1px 0 var(--lip), var(--sh-sm);
    /* transform only, per the rule at the top of this sheet — the shadow and
       the brightness lift swap in one paint instead of being animated across
       sixteen frames on every button the pointer crosses */
    transition: transform .12s ease;
  }
  .btn:hover { box-shadow: inset 0 1px 0 var(--lip), var(--sh-md); transform: translateY(-1px); }
  .btn:active { transform: translateY(0) scale(.985); }
  .btn:focus-visible {
    outline: none;
    box-shadow: inset 0 1px 0 var(--lip), var(--sh-sm),
                0 0 0 3px color-mix(in oklab, var(--accent) 42%, transparent);
  }
  .btn.primary {
    color: #fff;
    /* built on --accent-deep, not --accent: the label is white and it has to
       clear AA at the gradient's LIGHTEST point, not its average. The hot rose
       shows up as the top stop and in the glow below. */
    background: linear-gradient(146deg,
      color-mix(in oklab, var(--accent-deep) 74%, var(--accent)) 0%,
      var(--accent-deep) 48%,
      color-mix(in oklab, var(--accent-deep) 86%, #000) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.40),
      inset 0 -1px 0 rgba(0,0,0,.14),
      0 6px 16px -6px color-mix(in oklab, var(--accent) 72%, transparent),
      0 0 20px -6px color-mix(in oklab, var(--accent-2) calc(var(--glow) * 100%), transparent);
  }
  .btn.primary:hover {
    /* the lift is folded into the gradient rather than done with
       filter: brightness() — a filter, even a per-pixel one this cheap, gives
       the button its own render surface for as long as the pointer is on it,
       and every card carries one of these. Restating the stops costs a paint
       the changing shadow was going to force anyway. */
    background: linear-gradient(146deg,
      color-mix(in oklab, var(--accent-deep) 62%, var(--accent)) 0%,
      color-mix(in oklab, var(--accent-deep) 84%, var(--accent)) 48%,
      color-mix(in oklab, var(--accent-deep) 94%, #000) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.48),
      0 8px 22px -6px color-mix(in oklab, var(--accent) 78%, transparent),
      0 0 28px -4px color-mix(in oklab, var(--accent-2) calc(var(--glow) * 100%), transparent);
  }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 9px; }
  .btn.danger { color: var(--danger-text); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }

  .dot-unsaved {
    width: 8px; height: 8px; border-radius: 50%; flex: none; display: none;
    background: var(--st-warning);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--st-warning) 20%, transparent);
  }
  body.dirty .dot-unsaved { display: inline-block; }

  /* ---------- big money: the currency mark, set as notation ----------
     Measured in Segoe UI at 52px, which is what the hero was when this was
     worked out: ₹ has a 28.9px advance and a 36px ascent, against 28.9 and 37
     for a digit — the same width, the same weight, almost the same height. The
     ratios are what matter and they do not change with size, so the rule below
     still holds now the hero is 36px. At display sizes the eye reads it as a tenth
     numeral with bars through it rather than as a unit, and it lands first,
     before the number it is supposed to qualify. Set as its own node it goes
     back to being notation: two thirds the size, one weight lighter, and held
     at 70% of whatever the figure's own colour is — currentColor, not a fixed
     grey, so the red lapsed figure keeps a red mark and nothing has to be kept
     in step by hand.
     Everything here is in em, so one rule serves the 36px hero figure, the 24px
     card figure and the 17px side stats. money() itself is untouched and still
     returns a plain string: at 12–13px in a table the inline glyph is correctly
     proportioned, and that string still has to go into titles and attributes.
     $ takes the same rule for the same reason and by the same arithmetic — it is
     drawn about a cap height tall and near-symmetric about the S's middle, so its
     optical centre sits where ₹'s does, and the 0.21em lift lands both. */
  .cur {
    font-size: 0.63em; font-weight: 500;
    /* the pair-gap the number needs is smaller than a space and larger than the
       figure's own negative tracking leaves, so it is stated rather than inherited.
       Kept tight because tabular figures already carry their own: a 1 sits in the
       same slot as a 0, so its side bearings add a few px of air that no margin
       here can see. */
    letter-spacing: 0; margin-right: 0.03em;
    color: color-mix(in oklab, currentColor 70%, transparent);
    /* Centred on the digits' body, not left on their baseline. A smaller glyph
       sharing a baseline with 40px numerals hangs off their bottom edge and looks
       dropped rather than placed. Digits fill 0 to cap height, so their centre is
       at 0.35em; the mark's own cap height is 0.63 × 0.70 = 0.44em, centre 0.22em,
       so it lifts 0.13em — which is 0.21 of the mark's own em, the unit
       vertical-align lengths are in. Not a superscript: cap-aligning it would take
       0.51em and it would read as a footnote over the number.
       One ratio, so it holds at 52px, 40px, 28px and 20px alike, and it is a
       proportion of the font's own cap height rather than a pixel nudge — Roboto
       on the phone puts caps within a hundredth of an em of where Segoe UI does. */
    vertical-align: 0.21em;
  }
  /* Indian grouping puts two commas inside every six-figure sum, and at 40px+ a
     comma is a heavy wedge hanging below the baseline — three dark marks
     chopping the digits into pieces. Dropped to the same 70% as the mark they
     separate groups without competing with them. Size is left alone: the comma
     carries a tabular advance, and shrinking it would unpick the digit rhythm
     that tabular-nums is here to hold. */
  .sep { color: color-mix(in oklab, currentColor 70%, transparent); }
  /* Except on a figure that is already carrying colour as meaning. --danger-text
     measures 5.49:1 on the hero surface, and taking 30% of it away leaves the mark
     at 3.34, short of the 4.5:1 that small text owes. Nothing here is exempt as
     large text: at weight 500 the mark would have to clear 24px, and 0.63 of even
     the 36px figure is 22.7 — let alone the 17px side stats, where it is 10.7.
     No loss: the red is doing the emphasis, and the size and weight step alone is
     already enough to read the mark as notation. */
  .v-danger .cur, .v-danger .sep { color: currentColor; }

  /* ---------- hero: the showcase pane, sitting right where the ribbon
       crosses so there is something to look through ---------- */
  .hero {
    padding: 24px 26px; margin-bottom: 18px; overflow: hidden;
    display: flex; gap: 34px; align-items: flex-end; flex-wrap: wrap;
  }
  /* solid, not gradient-clipped: this is the one figure everything hangs
     off, so it gets full text contrast rather than a fade into the accent */
  /* 36px, down from 52px. Two currencies on one line and two decimals on the
     dollar made the old size a wall — "₹80,000 · $1,200.00" at 52px ran most of
     the way across the pane — and a figure only has to be the largest thing on
     the page to be read first, not large in absolute terms. Tracking eased from
     -0.03em to -0.02em to match: negative tracking is a correction for the gaps
     display sizes open up, and there are fewer of them to close at 36px. */
  .hero .figure {
    font-size: 36px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em;
    color: var(--text-primary);
    /* proportional digits make a 1 a third the width of a 0, so recording one buy
       used to shift every digit sideways. At this size that reads as the whole
       figure jumping. */
    font-variant-numeric: tabular-nums;
  }
  /* ---------- two currencies, set side by side and never added ----------
     A rupee total and a dollar total go on one line because they answer the same
     question, and they get a separator that makes no arithmetic claim: a plus
     would say they sum, and a slash reads as "per". The middle dot is already
     this file's separator everywhere else — "credited ₹x · deployed ₹y" — so it
     carries no new meaning to learn.
     baseline, not centre: the two figures are the same size but the dollar one is
     usually shorter, and aligning their boxes would float the smaller number.
     Wrapping is the phone's escape hatch — at 375px a six-figure rupee sum and a
     four-figure dollar sum just fit, and a seventh digit drops the second to its
     own line rather than off the edge. */
  .moneypair { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 12px; }
  /* Dimmed and scaled like the currency mark it sits between, so the three
     non-numerals on the line — ₹, · and $ — read as one register. It is a
     sibling of the figures rather than a child, so it cannot inherit their size
     in em the way .cur does; it is told which figure size it stands between
     instead, at the same 0.63 ratio (0.63 × 36, × 30, × 17). No vertical-align:
     a middle dot is drawn at about half x-height already, close enough to the
     digits' optical centre that a nudge only ever looks like a nudge. */
  .fig-sep { font-weight: 500; letter-spacing: 0; line-height: 1.05;
    color: color-mix(in oklab, currentColor 70%, transparent); }
  .fig-sep[data-for="figure"] { font-size: 23px; }
  .fig-sep[data-for="v"]      { font-size: 11px; }
  .hero .label { color: var(--text-secondary); font-size: 11.5px; margin-bottom: 3px;
    text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
  .hero .side { display: flex; gap: 30px; flex-wrap: wrap; padding-bottom: 6px; }
  .hero .side .v { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  /* a class rather than the inline style this used to be, so the rule above can
     reach inside it and leave the mark undimmed */
  .hero .side .v-danger { color: var(--danger-text); }

  /* ---------- tabs: segmented control ---------- */
  nav.tabs {
    display: inline-flex; gap: 3px; margin-bottom: 18px; padding: 4px;
    border-radius: 999px;
  }
  nav.tabs button {
    background: none; border: none; border-radius: 999px;
    padding: 7px 16px; color: var(--text-secondary); cursor: pointer;
    transition: color .15s ease, background .16s ease;
  }
  nav.tabs button:hover { color: var(--text-primary); background: var(--ghost); }
  nav.tabs button[aria-selected="true"] {
    color: #fff; font-weight: 600;
    background: linear-gradient(146deg,
      color-mix(in oklab, var(--accent-deep) 74%, var(--accent)),
      var(--accent-deep) 48%,
      color-mix(in oklab, var(--accent-deep) 86%, #000));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.38),
      0 4px 12px -4px color-mix(in oklab, var(--accent) 70%, transparent),
      0 0 16px -6px color-mix(in oklab, var(--accent-2) calc(var(--glow) * 100%), transparent);
  }

  /* ---------- dashboard groups ----------
     A heading and a rule, not another glass panel: the cards inside already have
     their own surface, and nesting one in another gives every card two frames.
     The summary is the whole hit target — 34px of it — because on a phone the
     triangle alone is not a thumb target. */
  .group { margin-bottom: 20px; }
  .group:last-child { margin-bottom: 0; }
  .group > summary {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 9px;
    cursor: pointer; padding: 5px 2px 11px;
    border-bottom: 1px solid var(--gridline); margin-bottom: 14px;
    list-style: none;                             /* Firefox's own marker */
  }
  .group > summary::-webkit-details-marker { display: none; }
  /* Own chevron rather than the native marker, which cannot be rotated and sits
     off the cap height. Transform only, so opening a section repaints the text
     and nothing under it. */
  .group > summary::before {
    content: "›"; font-size: 17px; line-height: 1; color: var(--text-muted);
    transition: transform .16s ease, color .15s ease;
  }
  .group[open] > summary::before { transform: rotate(90deg); }
  .group > summary:hover::before { color: var(--text-secondary); }
  .group .gnm { font-weight: 600; font-size: 14.5px; letter-spacing: -0.01em; }
  .group .gct {
    font-size: 11.5px; padding: 1px 7px; border-radius: 999px;
    background: var(--ghost); border: 1px solid var(--border); color: var(--text-muted);
  }
  .group .gtot {
    margin-left: auto; font-size: 12.5px; color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- cards ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(370px, 1fr)); gap: 16px; align-items: start; }
  .card {
    padding: 16px 17px 13px;
    display: flex; flex-direction: column; gap: 12px;
    /* transform only — animating a 48px-blur shadow repaints the card and
       everything under it for the whole 200ms. The lift reads on its own;
       the deeper shadow swaps in one repaint instead of sixteen. */
    transition: transform .16s ease;
    contain: layout style;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: inset 0 1px 0 var(--lip), inset 0 -1px 0 var(--lip-low),
                inset 0 0 30px -13px var(--inner-edge), var(--sh-lg);
  }

  .card-head { display: flex; align-items: flex-start; gap: 10px; }
  .card-head .nm { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .card-head .sub { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .chip {
    font-size: 11.5px; padding: 2px 8px; border-radius: 999px;
    background: var(--ghost); border: 1px solid var(--border);
    color: var(--text-secondary); white-space: nowrap;
  }
  /* status: icon + label always — colour never carries it alone */
  .status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 4px 10px 4px 7px;
    border-radius: 999px; margin-left: auto; white-space: nowrap;
    color: var(--text-primary);
    background: linear-gradient(150deg,
      color-mix(in oklab, var(--st) 20%, var(--surface-solid)),
      color-mix(in oklab, var(--st) 10%, var(--surface-solid)));
    border: 1px solid color-mix(in oklab, var(--st) 40%, var(--surface-solid));
    box-shadow: inset 0 1px 0 var(--lip),
                0 0 14px -6px color-mix(in oklab, var(--st) calc(var(--glow) * 100%), transparent);
  }
  /* The icon disc. It used to LIGHTEN --st toward white (80%/#fff) for a lit
     look and then put a white glyph on top — measured on the composited pixels
     that was 2.56:1 green, 2.62 vermilion, 3.32 red and 1.61 amber, i.e. all
     four states failed, worst of all the one meant to shout. The disc darkens
     now instead, and the lit look comes from the top lip rather than from
     bleaching the fill. 84/64 is the mildest darkening where every state clears
     4.5: green 5.12, vermilion 5.28, red 6.97, idle 8.58. */
  .status .ic {
    width: 15px; height: 15px; border-radius: 50%; flex: none;
    background: linear-gradient(160deg, color-mix(in oklab, var(--st) 84%, #000),
                                        color-mix(in oklab, var(--st) 64%, #000));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.30);
    color: #fff; font-size: 10px; line-height: 15px; text-align: center; font-weight: 700;
  }
  /* Amber is the one state that has to go the other way, and no amount of
     tuning changes it: --st-warning sits at luminance 0.52, so a white glyph
     needs the disc darkened until it is olive and no longer reads as amber at
     all. Bright disc, dark glyph — 8.09:1, and the hue survives. */
  .status.st-due .ic {
    background: linear-gradient(160deg, color-mix(in oklab, var(--st) 88%, #fff), var(--st));
    color: color-mix(in oklab, var(--st) 34%, #000);
  }

  .pending-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  /* 24px, following the hero down from 52 to 36 — it is the same figure one
     level in, and at the old 28px it would have sat within a few px of the total
     that is supposed to outrank it. */
  .pending-row .amt { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .pending-row .since { color: var(--text-secondary); font-size: 12.5px; }

  /* meter — the fill encodes a value, so gradient + glow only, never motion */
  .meter { --st: var(--series-1); }
  .meter .track {
    height: 9px; border-radius: 999px; overflow: hidden; position: relative;
    background: color-mix(in oklab, var(--st) 13%, var(--surface-solid));
    box-shadow: inset 0 1px 2px var(--inset);
  }
  .meter .fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(95deg, color-mix(in oklab, var(--st) 72%, #fff), var(--st));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.38),
                0 0 10px -2px color-mix(in oklab, var(--st) calc(var(--glow) * 100%), transparent);
  }
  .meter .ticks { display: flex; justify-content: space-between; margin-top: 5px; color: var(--text-muted); font-size: 11px; }

  .kv { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; }
  .kv div span { color: var(--text-muted); }
  .kv div b { font-weight: 600; }

  .card-actions { display: flex; gap: 7px; margin-top: auto; padding-top: 5px; flex-wrap: wrap; }
  /* height: auto so flex's default stretch runs: the header's icon buttons are a
     fixed 28px, which beside "Record buy" left a 4px step along the bottom of
     every card. The wider box is the tap target a phone wants anyway. */
  .card-actions .btn.sm.iconbtn { width: 38px; height: auto; align-self: stretch; }
  .card-actions .btn.sm.iconbtn svg { display: block; }

  /* ---------- price: claim, sparkline, context ----------
     A <button> because it opens the full chart, and a real button rather than a
     div so Enter, Space, focus order and the accessible name come free. It is
     styled flat so it reads as a line of the card rather than a control — the
     hover tint is the only affordance, which is the right weight for something
     every card carries. */
  .pricerow {
    display: flex; align-items: center; gap: 9px; width: 100%;
    margin-top: 9px; padding: 7px 9px;
    font: inherit; text-align: left; cursor: pointer;
    border: 1px solid var(--gridline); border-radius: 11px;
    background: transparent; color: var(--text-secondary);
    /* colour only: a lift here would move a 90-point path and the row below it */
    transition: background .16s ease, border-color .16s ease;
  }
  .pricerow:hover { background: var(--ghost); border-color: var(--border); }
  .pricerow:focus-visible {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 24%, transparent);
  }
  .pclaim { font-size: 12.5px; font-weight: 600; white-space: nowrap; color: var(--text-primary); }
  /* Pushed right, and the only thing allowed to shrink: on a narrow card the
     context truncates before the claim or the graph does. */
  .pctx {
    margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: 11px; color: var(--text-muted);
  }
  .spark { flex: 0 0 auto; display: block; overflow: visible; }
  /* 2px round-capped line, per the house chart specs. currentColor so one rule
     re-tones the whole graph from the tone class on the row. */
  .sl { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  /* The end dot carries a 2px ring in the SURFACE colour, not a border: it has
     to stay legible where it lands on top of the line it terminates. */
  .sd { fill: currentColor; stroke: var(--surface-solid); stroke-width: 2; }

  /* Two tones, and the graph's own direction picks it: down at ANY window's low
     is red, anything else is green. Requested explicitly, and it is the market
     convention, so it will read instantly — worth noting only that it inverts
     the buyer's meaning, since a low is the moment to deploy, and this now
     paints that moment in the same red the card uses for lapsing budget.

     Red-and-green is the textbook colourblind failure, so the colour is never
     the only channel: the claim beside the line says "3-month low" or "12-month
     high" in words, and the percentage on the right gives the position as a
     number. Remove the words and this row would be broken for ~8% of men.

     The colour no longer carries loudness, which the old accent/ink pair did —
     a technically-true "1-month low" on something sitting at 95% of its year
     now gets the same red as a genuine one. The context sentence is what stops
     that being misread, which is why it is always rendered. */
  .pricerow.tone-low {
    color: var(--danger-text);
    border-color: color-mix(in oklab, var(--danger-text) 34%, var(--gridline));
    background: color-mix(in oklab, var(--danger-text) 6%, transparent);
  }
  .pricerow.tone-high { color: var(--ok-text); }
  /* The claim wears the direction too: it is the text half of the same signal,
     and the one thing that keeps the signal readable without colour. */
  .pricerow.tone-low .pclaim  { color: var(--danger-text); }
  .pricerow.tone-high .pclaim { color: var(--ok-text); }

  /* Held at reduced opacity while a refresh is in flight, rather than blanked to
     a skeleton: the numbers on screen are still the numbers, they are just a
     minute old, and a flash of empty boxes on sixteen cards is a layout jump
     that says less than the stale value did. */
  body.prices-busy .pricerow { opacity: .55; }

  /* ---------- price: the detail sheet ---------- */
  .pshead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 3px; }
  /* Proportional figures, not tabular: this is a display-size standalone number,
     and tabular-nums gives every digit the width of a 0, which makes something
     like 121 look loose. The table below is where tabular belongs. */
  .psprice { font-size: 27px; font-weight: 600; letter-spacing: -0.02em; }
  .pssub { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .psrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }

  /* Height comes from the SVG, which is drawn at the container's own pixel width
     and includes the x-axis band in its box — a fixed height that fitted only the
     plot would give the modal a nested scrollbar to read the dates through. */
  .chartbox { position: relative; margin: 0 -2px 12px; color: var(--text-muted); }
  .chartbox svg { display: block; width: 100%; touch-action: pan-y; }
  /* Line, area wash and dots are all currentColor, so the direction is set once
     here and the whole chart follows — same two tones as the card row. */
  .chartbox.tone-low  { color: var(--danger-text); }
  .chartbox.tone-high { color: var(--ok-text); }

  .parea { fill: currentColor; opacity: .10; stroke: none; }
  .pline { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .pgrid { stroke: var(--gridline); stroke-width: 1; }        /* solid hairline, never dashed */
  .plab  { fill: var(--text-muted); font-size: 10.5px; }      /* text tokens, never the data colour */
  .plab.hi, .plab.lo { font-weight: 600; }
  .pdot { fill: currentColor; stroke: var(--surface-solid); stroke-width: 2; }
  .pend { fill: var(--text-primary); font-size: 11px; font-weight: 600; }

  /* The crosshair is a supplement: every number it shows is also written in the
     table under the chart, so a keyboard or touch reader loses nothing. */
  .pchair { stroke: var(--text-muted); stroke-width: 1; opacity: .55; }
  .ptip {
    position: absolute; top: 0; left: 0; pointer-events: none;
    padding: 5px 8px; border-radius: 8px; font-size: 11.5px; white-space: nowrap;
    background: var(--surface-solid); border: 1px solid var(--border);
    color: var(--text-primary); box-shadow: 0 6px 18px -8px rgba(20,4,28,.4);
  }
  .ptip b { font-variant-numeric: tabular-nums; }
  .ptip .d { color: var(--text-muted); font-weight: 400; }

  /* Fund-search results. A list of buttons rather than a <select>: the names run
     to eighty characters ("... - Direct Plan - Growth Option"), which a select
     truncates on every platform, and the distinguishing words are at the end. */
  .srcfind { margin-top: 8px; }
  .srcfind > #f-src-q { margin-bottom: 6px; }
  /* Ticked by default, and that default is the whole feature: mfapi returns every
     plan and option of a fund as its own row, so an unfiltered search for a
     popular index fund is thirty rows of which one is the one you hold. */
  .srconly { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
  .srconly input { width: auto; margin: 0; }
  .srcres { margin-top: 7px; display: grid; gap: 4px; max-height: 244px; overflow-y: auto; }
  /* Held while a newer query is in flight. Dimmed rather than cleared, and no
     spinner: the next answer is usually a subset of this one, so blanking the list
     between keystrokes would make it flicker on every letter. Opacity only —
     nothing moves, so a row cannot slide out from under a finger mid-tap. */
  .srcres.stale { opacity: .45; }
  .srcpick {
    display: block; width: 100%; text-align: left; cursor: pointer;
    font: inherit; font-size: 12px; padding: 7px 9px;
    border: 1px solid var(--gridline); border-radius: 9px;
    background: transparent; color: var(--text-secondary);
    transition: background .16s ease, border-color .16s ease;
  }
  .srcpick:hover { background: var(--ghost); border-color: var(--border); }
  .srcpick b { display: block; font-weight: 600; color: var(--text-primary); }
  .srcpick span { color: var(--text-muted); font-variant-numeric: tabular-nums; }

  /* The window whose extreme today's price is sitting on. Weight and ink, not
     hue: these are values in a table, and a value that wears the chart's colour
     starts looking like a second series. */
  table.grid td.mark { color: var(--text-primary); font-weight: 600; }

  /* ---------- tables ---------- */
  table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.grid th, table.grid td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--gridline); }
  table.grid th:first-child, table.grid td:first-child { text-align: left; }
  table.grid th { color: var(--text-muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
  table.grid td { font-variant-numeric: tabular-nums; }
  table.grid tbody tr:hover { background: var(--ghost); }
  table.grid tbody tr:last-child td { border-bottom: none; }
  table.grid td.lapse { color: var(--danger-text); font-weight: 600; }

  .panel { padding: 16px 18px; margin-bottom: 16px; }
  .panel > h3 { font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .muted { color: var(--text-muted); }
  .empty { text-align: center; padding: 52px 20px; color: var(--text-secondary); }
  .empty h2 { font-size: 17px; margin-bottom: 7px; letter-spacing: -0.015em; }
  .empty p { max-width: 460px; margin: 0 auto 18px; color: var(--text-muted); }

  /* ---------- forms / modal ---------- */
  /* NO backdrop-filter here either, though it was once thought to earn its
     cost. Measured: with blur(7px) on this full-viewport overlay, typing in a
     modal composited at 94ms/frame — about 10fps — against 3.4ms/frame with it
     off. A filter on a viewport-sized layer is re-run by the compositor as the
     modal above it repaints, so every keystroke paid for it, and every form in
     this app sits on this overlay. A deeper flat dim separates the modal just
     as well; the modal's own shadow does the rest.

     The dim is flat and only partly opaque, so the ribbon still glows behind
     the modal — that is what the frost has to bend, and it is free: the
     backdrop is one static fill over a layer that was already painted. */
  .backdrop {
    position: fixed; inset: 0;
    background: var(--dim);
    display: none; align-items: flex-start; justify-content: center; z-index: 40;
    padding: 40px 16px; overflow: auto;
  }
  .backdrop.open { display: flex; }
  /* Same lens recipe, denser frost. The hero looks through a gradient, but a
     form looks through whatever text happens to be under it, and glass that
     makes a label hard to read has stopped being a good joke. Overriding the
     two frost variables re-uses .lens's background wholesale rather than
     restating it — and per theme, so light mode stays white frost. */
  .modal {
    width: 100%; max-width: 560px; padding: 22px 24px 24px;
    animation: pop .2s cubic-bezier(.2,.8,.3,1) both;
    /* Sheer, and it stays sheer. I briefly took this to .94/.91 chasing an
       11.5px .hint that measured 4.17:1 — then measured only the pixels a glyph
       actually covers and found the tinted ones sat in the line box's top
       leading, 4px below the .customrow glow above and no ink within them. The
       real ink was never below 5:1. Sampling a text run's whole BOX, padding or
       leading included, invents failures and then spends real translucency
       buying them off.
       .88/.80 is a shade too sheer even so — measured on glyph pixels only it
       lands at 4.44 and 4.49, just under. This is the sheerest pair that clears
       4.5 on every run in the panel (tightest 4.78 light, 5.82 dark).
       Keep both declarations OUTSIDE this comment: a stray close-marker left
       above them makes the parser swallow --frost-a up to the next semicolon,
       and the modal then silently inherits the hero's much sheerer frost. That
       is exactly what happened, and it reads as a palette bug, not a syntax
       one — the tinted showthrough looks like a colour you chose. */
    --frost-a: rgba(255,255,255,0.90);
    --frost-b: rgba(255,255,255,0.83);
  }
  [data-theme="dark"] .modal {
    --frost-a: rgba(68,36,82,0.84);
    --frost-b: rgba(26,11,32,0.91);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.985); } }
  .modal h2 { font-size: 17px; margin-bottom: 15px; letter-spacing: -0.015em; }
  .field { margin-bottom: 13px; }
  .field > label { display: block; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 5px; }
  .hint { font-size: 11.5px; color: var(--text-muted); }
  .field .hint { margin-top: 4px; }
  input, select, textarea {
    width: 100%; padding: 9px 12px; font: inherit; color: var(--text-primary);
    background: var(--ghost);
    border: 1px solid var(--border); border-radius: 12px;
    box-shadow: inset 0 1px 2px var(--inset);
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  input:hover, select:hover, textarea:hover { border-color: color-mix(in oklab, var(--accent) 32%, var(--border)); }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: color-mix(in oklab, var(--accent) 62%, transparent);
    box-shadow: inset 0 1px 2px var(--inset),
                0 0 0 3px color-mix(in oklab, var(--accent) 24%, transparent);
  }
  /* A two-state field shown as two states. As a <select> it hid the alternative
     behind a tap, looked identical to the three other selects on this form, and
     on a phone opened a half-screen native picker to choose between two things —
     for the one field that decides what every amount below it means. The selected
     pill borrows nav.tabs' language one size down, so it reads as the same kind of
     control rather than a new one. Colour is not the only signal: aria-pressed
     carries it for a screen reader, and the ₹/$ mark is in the label either way. */
  /* nowrap + nowrap: the two labels stay on one line each and the pair stays on
     one line together, so this control is exactly as tall as the select beside it
     (40px) and cannot grow a second row when its column is narrow. It was doing
     precisely that at 375px before the phone rules below stopped pairing fields —
     but the guarantee belongs on the control, not on one breakpoint. */
  .seg {
    display: inline-flex; flex-wrap: nowrap; gap: 3px; padding: 3px;
    border-radius: 999px;
    background: var(--ghost); border: 1px solid var(--border);
    box-shadow: inset 0 1px 2px var(--inset);
  }
  .seg button {
    background: none; border: none; border-radius: 999px; cursor: pointer;
    font: inherit; font-size: 13px; padding: 7px 15px;
    white-space: nowrap; color: var(--text-secondary);
    /* colour and background only — a pill that also moved would shift the row */
    transition: color .15s ease, background .16s ease;
  }
  .seg button:hover { color: var(--text-primary); }
  .seg button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 24%, transparent);
  }
  .seg button[aria-pressed="true"] {
    color: #fff; font-weight: 600;
    background: linear-gradient(146deg,
      color-mix(in oklab, var(--accent-deep) 74%, var(--accent)),
      var(--accent-deep) 48%,
      color-mix(in oklab, var(--accent-deep) 86%, #000));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.38),
      0 4px 12px -4px color-mix(in oklab, var(--accent) 70%, transparent);
  }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 11px; }

  /* The paid-through badge that opens the buy sheet. `.status` is built for a
     card head, where `margin-left:auto` shoves it to the right edge — here it
     leads the row, so that has to come back off. */
  .paidrow, .syncrow {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: -4px 0 10px; font-size: 12.5px;
  }
  .paidrow .status, .syncrow .status { margin-left: 0; }

  /* The sync button doubles as the status light, so it needs to go loud without
     becoming another palette. The TEXT takes the ink tokens, not the status
     fills — --st-critical as ink is 3.69:1 in dark and --st-serious is 3.42:1 in
     light, which is the whole reason the ink siblings exist. The BORDER may keep
     the fill hue: it is a 3:1 non-text affordance and the tint is what makes the
     button read as the same object as the badge it is reporting on. */
  #btn-sync.s-warn { color: var(--danger-text); border-color: color-mix(in oklab, var(--st-critical) 45%, transparent); }
  #btn-sync.s-pend { color: var(--warn-text);   border-color: color-mix(in oklab, var(--st-serious) 40%, transparent); }
  #btn-sync.s-busy { opacity: 0.6; }

  /* Quick buy: which months is the entire decision, so the months are the form.
     One tap on a chip records the buy — nothing else to fill in, no Save. The
     chips are narrower than the old rupee ones because a month label is short. */
  .buygrid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
    gap: 8px; margin-bottom: 16px;
  }
  .buychip {
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    padding: 12px 14px; text-align: left; line-height: 1.25;
    border-radius: 15px;
  }
  .buychip b { font-size: 16.5px; font-weight: 600; letter-spacing: -0.01em; }
  .buychip span { font-size: 11.5px; font-weight: 400; }
  .customrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
  /* Two lookup buttons, so a third column rather than letting the second one wrap
     under a full-width input. Under 640px the field goes back to its own line and
     the buttons share the one below it, which is the only way two of them fit at
     375px without either shrinking to an ellipsis. */
  .customrow.two { grid-template-columns: 1fr auto auto; }
  @media (max-width: 640px) {
    .customrow.two { grid-template-columns: 1fr 1fr; }
    .customrow.two > input { grid-column: 1 / -1; }
  }

  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .modal-actions .left { margin-right: auto; }
  .allocrow { display: grid; grid-template-columns: 130px 1fr 30px; gap: 7px; margin-bottom: 7px; align-items: center; }

  .plan-item {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
    padding: 12px 10px; margin: 0 -10px; border-radius: var(--radius-sm);
    border-bottom: 1px solid var(--gridline);
  }
  .plan-item:hover { background: var(--ghost); }
  .plan-item:last-child { border-bottom: none; }
  .plan-item .nm { font-weight: 600; }
  .plan-item .meta { color: var(--text-muted); font-size: 12.5px; margin-top: 3px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(8px);
    border: 1px solid transparent; border-radius: 12px;
    background:
      linear-gradient(var(--surface-solid), var(--surface-solid)) padding-box,
      var(--rim) border-box;
    color: var(--text-primary);
    box-shadow: inset 0 1px 0 var(--lip), var(--sh-lg),
                0 0 24px -12px color-mix(in oklab, var(--accent) 60%, transparent);
    padding: 10px 17px; font-size: 13px; z-index: 60;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s cubic-bezier(.2,.8,.3,1);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* scrollbars */
  * { scrollbar-width: thin; scrollbar-color: var(--baseline) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--baseline); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* The Lite skin that used to live here is gone, along with its toggle: one skin
     now, the full glass, on every device. It existed for a streamed desktop (RDP /
     Citrix / VDI), where a frame costs whatever changed and how well it compresses,
     and it took away the things that dominate there — the wide shadow haloes that
     travel with each card on every scroll frame, the hover lifts, the per-card
     sheen, the coloured glows, and the alpha on every glass surface (opaque ones
     can be occlusion-culled, so the wash behind the column stops being re-blended).
     Removing it is deliberately a choice for the look over that measurement. What
     stays cheap regardless is what the rest of this sheet already holds itself to:
     the ribbon is one static texture painted once, no `filter` anywhere, the sticky
     header and the dropdown are opaque, and every transition is transform-only. */

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001s !important; transition-duration: .001s !important;
    }
  }

  /* The 740px branch that used to live here is gone with the two-layout header:
     it existed because six labelled buttons were ~442px of row against a ~193px
     brand, so the bar ran out of one-row space at ~730px. Three 34px icons and
     a dropdown fit at 320px, so there is nothing left for a breakpoint to fix. */

  @media (max-width: 620px) {
    .wrap { padding: 10px 13px 80px; }
    .hero { gap: 20px; padding: 17px 18px; }
    .hero .figure { font-size: 30px; }
    .fig-sep[data-for="figure"] { font-size: 19px; }   /* 0.63 × 30, as above */
    /* the two totals sit closer once there is less room for them to sit in */
    .moneypair { column-gap: 9px; }
    .hero .side { gap: 20px; }
    header.top { top: 6px; }
    /* The title got longer than the header. Two short lines rather than an
       ellipsis, because the part that would be cut is the part that was added on
       purpose; nowrap stays on desktop, where it fits on one line. */
    .brand h1 {
      font-size: 14.5px; line-height: 1.2; white-space: normal;
      overflow: visible; text-overflow: clip;
    }
    .brand { gap: 9px; }
    nav.tabs { display: flex; width: 100%; }
    nav.tabs button { flex: 1; padding: 8px 6px; }
    .cards { grid-template-columns: 1fr; }
    .row3 { grid-template-columns: 1fr; }

    /* ---------- the bucket form stops pairing fields ----------
       A month input carries the platform's own picker chrome and will not go
       below about 165px of min-content. `1fr` is minmax(AUTO, 1fr), so such a
       column does not shrink to its share — it pushes past it: measured at 375px,
       "Tracking starts" took 169 of the 283px available and left the "Opening
       backlog" amount beside it 113, which is where the two collided. The same
       squeeze wrapped the ₹/$ toggle onto two lines next to Type.
       No column width fixes this, because the floor is set by the platform's date
       control rather than by anything here. One field per row does. */
    .row2 { grid-template-columns: 1fr; }

    /* 16px exactly, and it is not a taste decision: iOS Safari and Android
       Chrome zoom the page in when a focused field's text is under 16px, which is
       the "it zooms in a little" every tap into one of these was causing at the
       inherited 14px. Nothing else on the page changes size — only the controls
       you type into, which are full-width single-column here and had the room. */
    input, select, textarea { font-size: 16px; }

    /* Same input and same reason in the effective-dated amount rows, which have a
       fixed 130px month column of their own. The remove button stays on the
       month's line so it is never ambiguous which row it removes; the amount
       takes the full width underneath. Bigger margin because each row is now two
       lines and 7px of it would read as the gap inside one. */
    .allocrow { grid-template-columns: 1fr 30px; margin-bottom: 13px; }
    .allocrow > [data-af]   { grid-area: 1 / 1; }
    .allocrow > [data-adel] { grid-area: 1 / 2; }
    .allocrow > [data-aa]   { grid-area: 2 / 1 / 3 / 3; }

    /* The panel heading is a flex row of a bare text node (the bucket name) plus
       the muted totals span. At this width the anonymous item for the name gets
       squeezed to min-content and breaks one word per line — "Nifty / 50 / Index".
       Stacking the two puts the name back on one line. */
    .panel > h3 { flex-direction: column; align-items: flex-start; gap: 3px; }

    /* ---------- ledger tables stop being tables ----------
       Five right-aligned money columns need ~376px of minimum width — the header
       cells are already nowrap at 12px, so that figure is a floor, not a choice —
       and a phone panel has ~313px of content box. The surplus used to push a
       horizontal scrollbar onto the whole PAGE, so the fix is not to make the
       table scroll but to stop laying it out as a grid: each row becomes a block,
       each cell a label/value line, and nothing overflows anything.
       The labels come from data-label on the cells, so there is one source for
       them; the header row is hidden rather than restated. */
    table.grid, table.grid tbody, table.grid tr, table.grid td { display: block; }
    table.grid thead { display: none; }
    table.grid tbody tr { padding: 9px 0; border-bottom: 1px solid var(--gridline); }
    table.grid tbody tr:last-child { border-bottom: none; padding-bottom: 0; }
    table.grid tbody tr:first-child { padding-top: 0; }
    table.grid td {
      border-bottom: none; padding: 2px 0;
      display: flex; align-items: baseline; gap: 14px;
    }
    /* the first cell is the row's identity — the month, or the date — so it reads
       as a heading over its own values rather than as another label/value pair */
    table.grid td:first-child {
      display: block; font-weight: 600; font-size: 13.5px; padding-bottom: 4px;
    }
    /* margin-right:auto rather than justify-content:space-between on the cell:
       a value can be more than one node (a dollar buy is "$500.00" plus a muted
       "(₹41,750 at 83.5)"), and space-between would spread those apart across the row
       instead of keeping them together at the right. Pushing only the label left
       groups however many value nodes there are. */
    table.grid td:not(:first-child)::before {
      content: attr(data-label);
      color: var(--text-muted); font-size: 12px; font-weight: 500;
